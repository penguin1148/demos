<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demos — The Dawn Era</title>
<style>
  /* ===========================================================
     Demos — Phase 1: The Dawn Era (900 BC – 750 BC)
     Single-file prototype.
     Aesthetic: ancient & rustic — parchment, terracotta, ochre,
     carved stone and inked serif lettering.
     =========================================================== */

  :root {
    /* Earth & parchment palette */
    --soil:      #241a12;   /* deep tilled earth (page) */
    --stone:     #1c1510;   /* carved stone (top bar) */
    --parch:     #e9dcbe;   /* parchment panels */
    --parch-2:   #e0d1ad;   /* parchment, shaded */
    --ink:       #3a2a19;   /* iron-gall ink (text on parchment) */
    --ink-soft:  #6d5238;   /* faded ink */
    --terra:     #a8492c;   /* terracotta accent */
    --terra-dark:#7c3520;   /* fired terracotta, shaded */
    --ochre:     #b07d2b;   /* ochre / aged gold */
    --olive:     #6f7536;   /* olive green */
    --good:      #5b7a2c;   /* growth (olive green) */
    --bad:       #9d3320;   /* decline (terracotta red) */
    --piety:     #3f7d86;   /* sacred teal (Eusebeia) */
    --border:    #b6985f;   /* aged brass border */
    --border-d:  #8a6f3e;
    --shadow:    0 6px 16px rgba(0,0,0,.45);
    --font-serif:"Iowan Old Style","Palatino Linotype","Book Antiqua","Georgia",serif;
    --chron-w:   290px;     /* chronicle side-panel width (toggled) */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--soil);
    color: var(--ink);
    font-family: var(--font-serif);
    overflow: hidden;
  }

  /* Rough tilled-earth texture for the page backdrop */
  body {
    display: flex;
    flex-direction: column;
    background-color: var(--soil);
    background-image:
      repeating-linear-gradient(0deg,   rgba(0,0,0,.18) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg,  rgba(255,220,160,.03) 0 1px, transparent 1px 6px),
      radial-gradient(circle at 30% 20%, #2e2117, #1d140d 80%);
  }

  /* ---------- Top Bar: a carved stone lintel ---------- */
  #top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, #2a201700, #00000040),
      var(--stone);
    border-bottom: 4px solid var(--terra-dark);
    box-shadow: 0 4px 0 #120c08, var(--shadow);
    z-index: 2;
  }

  #title-block { display: flex; align-items: baseline; gap: 14px; }

  #title-block h1 {
    font-size: 26px;
    letter-spacing: 7px;
    color: var(--ochre);
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #000, 0 0 10px rgba(176,125,43,.25);
  }

  #city-name {
    font-size: 15px;
    color: #c9b489;
    font-style: italic;
    letter-spacing: 1px;
  }

  #status-readout { display: flex; gap: 6px; }

  .stat-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 92px;
    padding: 3px 12px;
    border-left: 1px solid #44372a;
  }
  .stat-chip:first-child { border-left: none; }

  .stat-chip .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #93805f;
  }
  .stat-chip .value {
    font-size: 21px;
    color: #e9dcbe;
    margin-top: 2px;
    text-shadow: 1px 1px 0 #000;
  }
  .stat-chip .value.phase { color: var(--ochre); font-size: 15px; font-style: italic; }
  /* Macro-variables (Kleos / Eusebeia) — visually distinct from time */
  .stat-chip.macro { border-left: 1px solid #44372a; }
  .stat-chip.macro .label { color: #a99368; }
  .value.macro-kleos { color: #e6c463; }
  .value.macro-piety { color: #7fc4cf; }

  /* ---------- Main Viewport: a three-column field ---------- */
  #viewport {
    flex: 1;
    display: grid;
    grid-template-columns: 290px minmax(0, 1fr) var(--chron-w);
    gap: 16px;
    padding: 16px 24px;
    min-height: 0;
    transition: grid-template-columns .25s ease;
  }
  #viewport.chron-lg { --chron-w: 470px; }

  /* Parchment panels with an aged, double-ruled border */
  .panel {
    background:
      repeating-linear-gradient(0deg, rgba(120,90,40,.04) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, var(--parch), var(--parch-2));
    border: 2px solid var(--border);
    outline: 2px solid var(--border-d);
    outline-offset: 2px;
    border-radius: 3px;
    box-shadow: var(--shadow), inset 0 0 40px rgba(140,105,55,.18);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-header {
    padding: 11px 16px;
    border-bottom: 2px solid var(--border-d);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--terra-dark);
    font-weight: 700;
    font-variant: small-caps;
    background: linear-gradient(180deg, rgba(176,125,43,.14), transparent);
  }

  .panel-body { padding: 14px 16px; overflow-y: auto; flex: 1; }

  /* ---------- Resource rows ---------- */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px dotted var(--border-d);
  }
  .stat-row:last-child { border-bottom: none; }

  .stat-row .stat-name {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--ink);
    font-size: 15px;
  }
  .stat-row .stat-icon { font-size: 19px; width: 22px; text-align: center; }
  .stat-row .stat-sub { font-size: 11px; color: var(--ink-soft); font-style: italic; }

  .stat-figures { display: flex; align-items: baseline; gap: 10px; }
  .stat-row .stat-val {
    font-size: 21px;
    color: var(--ink);
    font-weight: 700;
    min-width: 46px;
    text-align: right;
  }

  /* Net-change text indicators: "+5" / "-2" */
  .delta {
    font-size: 13px;
    font-weight: 700;
    min-width: 34px;
    text-align: left;
    font-style: italic;
  }
  .delta.pos { color: var(--good); }
  .delta.neg { color: var(--bad); }
  .delta.zero { color: var(--ink-soft); opacity: .55; }

  /* ---------- Labour allocation (job distribution sliders) ---------- */
  .job-alloc {
    display: flex; align-items: center; gap: 12px;
    padding: 7px 2px; border-bottom: 1px dotted var(--border-d);
  }
  .job-alloc:last-of-type { border-bottom: none; }
  .ja-icon { font-size: 20px; width: 24px; text-align: center; }
  .ja-name { flex: 0 0 120px; font-size: 14px; color: var(--ink); }
  .ja-name small { display: block; font-size: 11px; color: var(--ink-soft); font-style: italic; }
  .ja-range { flex: 1; accent-color: var(--terra); cursor: pointer; }
  .ja-count { flex: 0 0 88px; text-align: right; font-size: 13px; color: var(--ink-soft); }
  .ja-count b { color: var(--ink); font-size: 16px; }
  .ja-balance { margin-top: 14px; padding: 10px 12px; border-radius: 5px; font-size: 13px; font-weight: 600; line-height: 1.4; }
  .ja-balance.good { background: rgba(91,122,44,.16);  color: var(--good); border: 1px solid var(--good); }
  .ja-balance.bad  { background: rgba(157,51,32,.14);  color: var(--bad);  border: 1px solid var(--bad); }
  .ja-balance b { font-weight: 700; }
  .ja-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; font-size: 13px; color: var(--ink);
    font-variant: small-caps; letter-spacing: 1px;
  }

  /* ---------- Map panel: the painted lands of Demos ---------- */
  #map-panel .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #map-panel .panel-body { padding: 0; position: relative; overflow: hidden; }
  .map-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .map-btn {
    font-family: var(--font-serif);
    font-variant: small-caps;
    font-size: 12px;
    letter-spacing: 1px;
    color: #f3e6c8;
    background: linear-gradient(180deg, var(--terra), var(--terra-dark));
    border: 1px solid #5e2616;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    box-shadow: 0 2px 0 #4d1f12;
    text-shadow: 1px 1px 0 #3a160c;
  }
  .map-btn:hover  { filter: brightness(1.08); }
  .map-btn:active { transform: translateY(2px); box-shadow: none; }
  .map-btn .badge {
    background: #f3e6c8; color: var(--terra-dark);
    border-radius: 8px; padding: 0 6px; margin-left: 6px; font-weight: 700;
  }

  #map-field { position: absolute; inset: 0; background: #9cc0d8; }
  .map-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Interactive overlay sitting atop the painting */
  #map-overlay { position: absolute; inset: 0; pointer-events: none; }
  .map-label {
    position: absolute; transform: translate(-50%, -50%);
    z-index: 4; pointer-events: auto; text-align: center;
    padding: 4px 11px; white-space: nowrap;
    background: rgba(245,235,208,.92);
    border: 1px solid var(--terra-dark);
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(0,0,0,.45);
  }
  .map-label .ml-name { font-size: 12px; font-weight: 700; color: var(--terra-dark); font-variant: small-caps; letter-spacing: .5px; }
  .map-label .ml-sub  { font-size: 10px; color: var(--ink-soft); font-style: italic; }
  .map-label .ml-sub.joined { color: var(--olive); font-style: normal; font-weight: 700; }
  .map-label.polis { border-color: var(--ochre); border-width: 2px; background: rgba(248,239,214,.96); }
  .map-label.polis .ml-name { color: #8a5a16; font-size: 13px; }
  .map-label.hamlet { cursor: pointer; transition: transform .1s ease, box-shadow .15s ease; }
  .map-label.hamlet:hover { transform: translate(-50%,-50%) scale(1.06); box-shadow: 0 6px 16px rgba(0,0,0,.55); }
  .map-label.hamlet.absorbed { cursor: default; border-color: var(--olive); background: rgba(229,233,206,.92); }

  #unrest-banner {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 6; background: var(--bad); color: #f3e6c8;
    font-variant: small-caps; letter-spacing: 1px; font-size: 13px;
    padding: 5px 14px; border-radius: 4px; border: 1px solid #5e2616;
    box-shadow: var(--shadow); pointer-events: none;
  }

  /* ---------- Chronicle: a collapsible side scroll ---------- */
  #chronicle { min-height: 0; }
  #chronicle .panel-header {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .chron-enlarge {
    font-family: var(--font-serif); font-variant: small-caps; letter-spacing: 1px;
    font-size: 11px; color: #f3e6c8; cursor: pointer;
    background: linear-gradient(180deg, var(--terra), var(--terra-dark));
    border: 1px solid #5e2616; border-radius: 4px; padding: 3px 9px;
    box-shadow: 0 2px 0 #4d1f12; text-shadow: 1px 1px 0 #3a160c;
  }
  .chron-enlarge:hover { filter: brightness(1.08); }
  .chron-enlarge:active { transform: translateY(2px); box-shadow: none; }
  #chronicle-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 14px;
    font-size: 13px;
    line-height: 1.55;
    background-image: repeating-linear-gradient(180deg, transparent 0 26px, rgba(140,105,55,.12) 26px 27px);
  }
  .log-entry { padding: 5px 0; animation: fadein .3s ease; color: var(--ink); }
  .log-entry .log-year {
    color: var(--terra-dark); font-weight: 700; margin-right: 8px; font-variant: small-caps;
  }
  .log-entry.log-event   .log-text { color: var(--olive); font-weight: 600; }
  .log-entry.log-system  .log-text { color: var(--ink-soft); font-style: italic; }
  .log-entry.log-warning .log-text { color: var(--bad); font-weight: 700; }

  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  /* ---------- Control Panel: a stone shelf ---------- */
  #control-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 11px 28px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 9px),
      var(--stone);
    border-top: 3px solid var(--terra-dark);
  }
  #control-hint { font-size: 13px; color: #b6a079; font-style: italic; }

  /* End Turn: a fired-clay tablet */
  #end-turn-btn {
    font-family: var(--font-serif);
    font-size: 17px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-variant: small-caps;
    font-weight: 700;
    color: #f3e6c8;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, var(--terra), var(--terra-dark));
    border: 2px solid #5e2616;
    border-radius: 4px;
    padding: 12px 38px;
    cursor: pointer;
    transition: transform .08s ease, filter .15s ease, box-shadow .15s ease;
    box-shadow: 0 4px 0 #4d1f12, var(--shadow);
    text-shadow: 1px 1px 0 #3a160c;
  }
  #end-turn-btn:hover  { filter: brightness(1.08); }
  #end-turn-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4d1f12; }
  #end-turn-btn:disabled {
    filter: grayscale(.55) brightness(.7);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ---------- Modals ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20,12,6,.72);
    display: flex; align-items: center; justify-content: center;
    animation: fadein .2s ease;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal { width: min(720px, 92vw); max-height: 84vh; }
  .modal .panel-header { display: flex; align-items: center; justify-content: space-between; }
  .modal-close {
    background: none; border: none; color: var(--terra-dark);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; font-weight: 700;
  }
  .modal-close:hover { color: var(--bad); }
  .modal-body { padding: 16px; overflow-y: auto; }
  #labor-body.modal-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 16px; overflow-y: auto;
  }

  /* Cards shared by Administration & Civic Investments modals */
  .hamlet-card {
    border: 1px solid var(--border-d);
    border-radius: 5px; padding: 14px 16px; margin-bottom: 14px;
    background: rgba(255,255,255,.18);
    box-shadow: inset 0 0 16px rgba(140,105,55,.15);
  }
  .hamlet-card:last-child { margin-bottom: 0; }
  .hamlet-card .hc-head { display: flex; align-items: baseline; justify-content: space-between; }
  .hamlet-card .hc-name { font-size: 17px; font-weight: 700; color: var(--terra-dark); font-variant: small-caps; letter-spacing: 1px; }
  .hamlet-card .hc-pop  { font-size: 12px; color: var(--ink-soft); font-style: italic; }
  .hamlet-card .hc-desc { font-size: 13px; color: var(--ink); margin: 6px 0; line-height: 1.5; }
  .hamlet-card .hc-asset { font-size: 13px; color: var(--olive); font-weight: 600; margin-bottom: 10px; }
  .hamlet-card .hc-asset b { color: var(--terra-dark); }
  .hamlet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-btn {
    flex: 1 1 0; min-width: 220px;
    font-family: var(--font-serif); text-align: left;
    border-radius: 5px; padding: 10px 12px; cursor: pointer;
    border: 2px solid #5e2616; color: #f3e6c8;
    background: linear-gradient(180deg, var(--terra), var(--terra-dark));
    box-shadow: 0 3px 0 #4d1f12; text-shadow: 1px 1px 0 #3a160c;
  }
  .action-btn.diplomatic {
    border-color: #4f5a25;
    background: linear-gradient(180deg, #7f8a3e, #565f29);
    box-shadow: 0 3px 0 #3a4019; text-shadow: 1px 1px 0 #2a2e12;
  }
  .action-btn:hover  { filter: brightness(1.08); }
  .action-btn:active { transform: translateY(3px); box-shadow: none; }
  .action-btn:disabled { filter: grayscale(.6) brightness(.7); cursor: not-allowed; box-shadow: none; }
  .action-btn .ab-title { display: block; font-variant: small-caps; font-weight: 700; letter-spacing: 1px; font-size: 15px; }
  .action-btn .ab-cost  { display: block; font-size: 12px; opacity: .92; margin-top: 3px; }
  .admin-intro { font-size: 13px; color: var(--ink-soft); font-style: italic; margin-bottom: 14px; line-height: 1.5; }
  .admin-done {
    text-align: center; color: var(--olive); font-weight: 700; font-size: 16px;
    padding: 28px 8px; font-variant: small-caps; letter-spacing: 1px; line-height: 1.5;
  }
  .civic-built {
    flex: 1; color: var(--olive); font-weight: 700; font-variant: small-caps;
    letter-spacing: 1px; padding: 10px 4px; font-size: 14px;
  }

  /* Crisis modal — a darker, urgent tone */
  .crisis-panel { border-color: var(--bad); outline-color: #6e2418; }
  .crisis-panel .panel-header { color: var(--bad); }
  .crisis-head { display: flex; align-items: center; gap: 14px; }
  .crisis-icon { font-size: 36px; }
  .crisis-name { font-size: 21px; font-weight: 700; color: var(--bad); font-variant: small-caps; letter-spacing: 1px; }
  .crisis-desc { margin: 12px 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
  .crisis-threat { font-size: 13px; color: var(--bad); font-weight: 600; margin-bottom: 14px; }
  .crisis-threat b { font-weight: 700; }
  .crisis-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .value.macro-discontent { color: #9bbf6a; }

  /* Hekatomb festival minigame */
  .festival-panel { border-color: var(--ochre); outline-color: #8a6f2a; }
  .festival-panel .panel-header { color: #8a5a16; }
  .fest-intro { font-size: 13px; color: var(--ink-soft); font-style: italic; margin-bottom: 14px; line-height: 1.5; }
  .fest-pool {
    border: 1px solid var(--border-d); border-radius: 5px; padding: 12px 14px; margin-bottom: 12px;
    background: rgba(255,255,255,.18); box-shadow: inset 0 0 16px rgba(140,105,55,.15);
  }
  .fest-pool .fp-title { font-variant: small-caps; font-weight: 700; letter-spacing: 1px; color: var(--terra-dark); font-size: 16px; }
  .fest-pool .fp-desc { font-size: 12px; color: var(--ink-soft); margin: 3px 0 8px; line-height: 1.45; }
  .fest-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .fest-row label { flex: 0 0 132px; font-size: 13px; color: var(--ink); }
  .fest-row input[type=range] { flex: 1; accent-color: var(--terra); cursor: pointer; }
  .fest-row .fest-val { flex: 0 0 86px; text-align: right; font-weight: 700; color: var(--ink); font-size: 13px; }
  .fest-gain { font-size: 13px; color: var(--olive); font-weight: 700; margin-top: 4px; }
  .fest-pool.fest-granary { border-color: var(--olive); }
  .fest-pool.fest-granary .fp-title { color: var(--olive); }
  .fest-leftover { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; color: var(--ink); }
  .fest-leftover b { color: var(--terra-dark); }
  .fest-warn { color: var(--bad); font-size: 12px; font-weight: 700; min-height: 16px; margin: 6px 0; }
  .fest-confirm .action-btn { width: 100%; text-align: center; }
  .fest-confirm .action-btn .ab-title { font-size: 16px; }

  /* ---------- Divine Epiphany (card minigame) ---------- */
  .epiphany-panel { border-color: #6a4d8a; outline-color: #4b3563; }
  .epiphany-panel .panel-header { color: #5a3f7a; }
  .deck-label {
    text-align: center; font-variant: small-caps; letter-spacing: 1px;
    color: var(--ink-soft); font-size: 12px; margin: 12px 0 6px;
  }
  .deck { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .god-card {
    width: 124px; padding: 9px 8px; text-align: center; cursor: grab;
    background: linear-gradient(170deg, #efe6cf, #e3d3ad);
    border: 2px solid var(--border-d); border-radius: 7px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: transform .1s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .god-card:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0,0,0,.4); }
  .god-card.dragging { opacity: .5; }
  .god-card.picked { opacity: .35; cursor: default; }
  .god-card.aspect  { border-color: #4f6a86; }
  .god-card.epithet { border-color: #8a6a2a; }
  .god-card .gc-icon { font-size: 24px; }
  .god-card .gc-name { font-weight: 700; font-variant: small-caps; color: var(--terra-dark); font-size: 14px; }
  .god-card .gc-sub  { font-size: 11px; font-style: italic; color: var(--ink-soft); }
  .god-card .gc-desc { font-size: 10px; color: var(--ink); margin-top: 3px; line-height: 1.3; }

  .shrine {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 14px 0; padding: 14px 10px;
    background: rgba(106,77,138,.08);
    border: 1px solid #6a4d8a; border-radius: 8px;
  }
  .shrine-slot {
    width: 124px; min-height: 96px; padding: 6px;
    border: 2px dashed #6a4d8a; border-radius: 7px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--ink-soft); cursor: pointer;
  }
  .shrine-slot.filled { border-style: solid; background: rgba(255,255,255,.35); }
  .shrine-slot.over { background: rgba(106,77,138,.18); border-color: var(--terra); }
  .shrine-slot .slot-hint { font-size: 12px; font-style: italic; }
  .shrine-slot .gc-icon { font-size: 24px; }
  .shrine-slot .gc-name { font-weight: 700; font-variant: small-caps; color: var(--terra-dark); font-size: 14px; }
  .shrine-slot .gc-sub  { font-size: 11px; font-style: italic; color: var(--ink-soft); }
  .shrine-op { font-size: 22px; color: #5a3f7a; }
  .deity-preview { min-width: 150px; text-align: center; }
  .deity-name { font-size: 19px; font-weight: 700; font-variant: small-caps; color: var(--terra-dark); letter-spacing: 1px; }
  .deity-tag { font-size: 12px; font-weight: 700; font-variant: small-caps; }
  .deity-tag.harmonious { color: var(--good); }
  .deity-tag.confused   { color: var(--bad); }
  .deity-perk { font-size: 12px; color: var(--ink); margin-top: 4px; line-height: 1.35; }

  .pantheon-slots { display: flex; gap: 10px; justify-content: center; }
  .pan-slot {
    flex: 1; min-height: 64px; padding: 8px 6px; text-align: center; cursor: pointer;
    background: rgba(255,255,255,.16); border: 1px solid var(--border-d); border-radius: 6px;
  }
  .pan-slot.filled { background: rgba(111,117,54,.14); }
  .pan-slot.target { border: 2px solid var(--terra); box-shadow: 0 0 0 2px rgba(168,73,44,.25); }
  .pan-slot .pan-name { font-weight: 700; font-variant: small-caps; color: var(--terra-dark); font-size: 13px; }
  .pan-slot .pan-perk { font-size: 11px; color: var(--ink-soft); }
  .pan-slot .pan-empty { font-size: 12px; color: var(--ink-soft); font-style: italic; padding-top: 14px; }
  .epiphany-actions { display: flex; gap: 10px; margin-top: 14px; }

  /* Pantheon list in the Civic modal */
  .pantheon-list { display: flex; flex-direction: column; gap: 6px; }
  .pan-row {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 7px 10px; border-radius: 5px; font-size: 13px;
    background: rgba(255,255,255,.16); border: 1px solid var(--border-d);
  }
  .pan-row.empty { opacity: .7; font-style: italic; }
  .pan-row.harmonious { border-color: var(--good); }
  .pan-row.confused   { border-color: var(--bad); }
  .pan-row .pan-god { font-weight: 700; font-variant: small-caps; color: var(--terra-dark); }
  .pan-row .pan-blessing { color: var(--ink-soft); text-align: right; }

  /* Scrollbars styled like worn leather */
  ::-webkit-scrollbar { width: 11px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,.08); }
  ::-webkit-scrollbar-thumb { background: var(--border-d); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--terra-dark); }
</style>

  pendingCrisis: null,

  unrest: 0,

  // Net deltas captured during the last tick, used for "+5"/"-2" text.
  lastDeltas: {},

  // The chronicle: an append-only list of historical entries.
  chronicle: [],
};

/* ---------- Display metadata for resources ---------- */
const STAT_META = {
  population: { icon: "👥", label: "Population", sub: "souls" },
  grain:      { icon: "🌾", label: "Grain",      sub: "food stores" },
  cattle:     { icon: "🐄", label: "Cattle",     sub: "wealth & trade" },
  olives:     { icon: "🫒", label: "Olives",     sub: "oil & hygiene" },
  grapes:     { icon: "🍇", label: "Grapes",     sub: "wine & ritual" },
  timber:     { icon: "🪵", label: "Timber",     sub: "building" },
  clay:       { icon: "🧱", label: "Clay",       sub: "building" },
};

/* ---------- Flavor: era-appropriate random events ---------- */
const DAWN_EVENTS = [
  { text: "A bountiful harvest swells the granaries.",          stats: { grain: +24 } },
  { text: "The olive groves come into full bearing.",          stats: { olives: +10 } },

  { text: "A fine calving season fattens the herds.",          stats: { cattle: +4 } },

  { text: "Drought withers the standing grain.",               stats: { grain: -18 } },

  { text: "A storm scatters the woodpiles and breaks kilns.",  stats: { timber: -8, clay: -5 } },

/*
 * Early structural CRISES (15% chance per turn). Each may be weathered
 * by spending Piety to "Invoke Divine Favor" (mitigated outcome); lacking

 */
const CRISES = [
  { id: "blight", name: "Crop Blight", icon: "🐛", pietyCost: 8,
    desc: "A grey rot creeps through the barley; the standing harvest withers in the field.",
    damage: { grain: -32 }, mitigated: { grain: -8 } },
  { id: "quake", name: "Earthquake Tremor", icon: "🌋", pietyCost: 11,
    desc: "The earth shudders. Mud-brick walls crack and a storehouse spills into the dust.",
    damage: { clay: -12, timber: -10, population: -6 }, mitigated: { clay: -4, population: -1 } },
  { id: "plague", name: "Fever in the Wells", icon: "🤒", pietyCost: 12,
    desc: "A sickness rises from the wells and spreads hut to hut, laying the people low.",
    damage: { population: -13 }, mitigated: { population: -3 } },
  { id: "tempest", name: "Tempest from the Sea", icon: "⛈️", pietyCost: 9,
    desc: "A violent storm batters the coast, scattering the flocks and soaking the grain.",
    damage: { cattle: -5, grain: -14 }, mitigated: { grain: -3 } },
  { id: "wolves", name: "Wolves from the Hills", icon: "🐺", pietyCost: 7,
    desc: "A hard season drives gaunt wolves down from the high country, upon the herds.",
    damage: { cattle: -7 }, mitigated: { cattle: -2 } },
];

/*
 * SYNOIKISMOS — the surrounding independent hamlets that may be unified
 * into the Polis. Each controls a unique resource asset that, once
 * absorbed, is permanently folded into the city's turn generation.
 *
 *  pos   — placement of the interactive label on the map (percent).
 *  asset — { label, bonus } added to GameState.bonuses on absorption.
 *  feast — Diplomatic Feast cost (wine/grapes + cattle); slow, costly, certain.
 *  annex — Coercive Annexation cost per push (cattle + grain supplies).
 *  resistance — successful pushes needed before the hamlet is broken; a
 *               hamlet can be pushed at most once per turn, so unifying one
 *               by force is the work of many turns, not a couple.
 */
const HAMLETS = [
  {
    id: "foothill", name: "The Foothill Clan", icon: "⛰️",
    population: 30, pos: { top: "52%", left: "14%" }, resistance: 3,
    desc: "Hardy highlanders who fell timber and quarry stone from the upland forests.",
    asset: { label: "timber from the high forests", bonus: { timber: +6 } },
    feast: { grapes: 72, cattle: 16 },
    annex: { cattle: 18, grain: 22 },
  },
  {
    id: "coastal", name: "The Coastal Fishermen", icon: "🌊",
    population: 25, pos: { top: "84%", left: "69%" }, resistance: 3,
    desc: "Fisherfolk whose nets bring a steady catch to feed the growing city.",
    asset: { label: "a steady catch that swells the food stores", bonus: { grain: +8 } },
    feast: { grapes: 60, cattle: 14 },
    annex: { cattle: 15, grain: 18 },
  },
  {
    id: "river", name: "The River Valley Tribe", icon: "🏞️",
    population: 40, pos: { top: "85%", left: "28%" }, resistance: 4,
    desc: "Potters and farmers of the fertile river bend, rich in clay and grain.",
    asset: { label: "clay and grain from the river bend", bonus: { clay: +6, grain: +3 } },
    feast: { grapes: 88, cattle: 22 },
    annex: { cattle: 24, grain: 30 },
  },
];

/* ===================================================================
   ENGINE LOGIC
   =================================================================== */

/** Convert internal year value to a display string (e.g. "900 BC"). */
function formatYear(y) {
  return y > 0 ? `${y} BC` : `${Math.abs(y) + 1} AD`;
}

/** Pick a random element from an array. */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/** Format a stat-change object as readable text, e.g. "−30 Grain, −6 Population". */
function formatChanges(obj) {
  const parts = Object.keys(obj).map(k => {
    const v = obj[k];
    const label = STAT_META[k] ? STAT_META[k].label : k;
    return `${v >= 0 ? "+" : "−"}${Math.abs(v)} ${label}`;
  });
  return parts.join(", ");
}

/**
 * Append an entry to the chronicle and (if mounted) the log panel.
 * @param {string} text  The message body.
 * @param {string} kind  "system" | "turn" | "event" | "warning"
 */
function logChronicle(text, kind = "turn") {
  const entry = { year: GameState.year, text, kind };
  GameState.chronicle.push(entry);
  renderLogEntry(entry);
}

/**
 * Apply a set of stat changes, clamping at zero, and record net deltas.
 * @param {Object} changes  e.g. { grain: +10, population: -2 }
 */
function applyStats(changes) {
  for (const key in changes) {
    if (!(key in GameState.stats)) continue;
    const before = GameState.stats[key];
    const after = Math.max(0, before + changes[key]);
    GameState.stats[key] = after;
    GameState.lastDeltas[key] = (GameState.lastDeltas[key] || 0) + (after - before);
  }
}

/** Divide the population among the trades according to the player's weights. */
function assignJobs(population) {
  const w = GameState.jobAllocation;
  let total = 0;
  for (const key in JOBS) total += (w[key] || 0);
  if (total <= 0) total = 1;
  const counts = {};
  for (const key in JOBS) counts[key] = Math.round(population * (w[key] || 0) / total);
  return counts;
}

/**
 * Process the deterministic part of a timeline tick:
 * passive production from labour, grain consumption / starvation,
 * surplus-driven population growth, then the cultural systems
 * (altar piety and Kleos-driven migration).
 */
function processTick() {
  const s = GameState.stats;

  // --- Labour: assign jobs and produce resources passively ---
  const jobs = assignJobs(s.population);
  GameState.jobs = jobs;

  // Base production from labour.
  const prod = {
    grain:  jobs.farmers      * YIELD.grain,
    timber: jobs.woodcutters  * YIELD.timber,
    clay:   jobs.potters      * YIELD.clay,
    olives: jobs.oliveGrowers * YIELD.olives,
    grapes: jobs.vintners     * YIELD.grapes,
    cattle: Math.floor(jobs.herders * YIELD.cattle),
  };

  // Permanent bonuses from hamlets absorbed via synoikismos.
  for (const key in GameState.bonuses) {
    prod[key] = (prod[key] || 0) + GameState.bonuses[key];
  }

  // Civil unrest (from a failed annexation) throttles all production.
  const factor = GameState.unrest > 0 ? CONFIG.UNREST_FACTOR : 1;
  for (const key in prod) prod[key] = Math.floor(prod[key] * factor);

  const grainProduced = prod.grain;   // grain grown this turn (for the growth model)
  applyStats(prod);

  if (GameState.unrest > 0) {
    logChronicle(
      `Civil unrest grips the Polis — production falters ` +
      `(${GameState.unrest} ${GameState.unrest === 1 ? "turn" : "turns"} remaining).`,
      "warning"
    );
    GameState.unrest -= 1;
  }

  // --- Consumption: every citizen eats grain ---
  const needed = Math.ceil(s.population * CONFIG.GRAIN_PER_CITIZEN);

  if (s.grain >= needed) {
    // The settlement is fed; a sustainable per-turn surplus supports growth.
    applyStats({ grain: -needed });
    const turnSurplus = grainProduced - needed;   // what this year's harvest spared

    let growth = Math.max(0, Math.floor(turnSurplus / 25));
    if (s.olives > 0) growth += 1;                              // health & hygiene
    if (s.grapes > 0 && GameState.turn % 2 === 0) growth += 1;  // festivals & births
    growth -= Math.floor(GameState.unhappiness / 8);            // discontent dampens growth
    growth = Math.max(0, Math.min(growth, 6));                  // modest absolute cap (no runaway)

    if (growth > 0) {
      applyStats({ population: +growth });
      logChronicle(`The people prosper; ${growth} new souls join the Demos.`, "turn");
    }
  } else {
    // Granaries run dry — STARVATION.
    const deficit = needed - s.grain;
    applyStats({ grain: -s.grain });   // empty the granary
    const starved = Math.min(s.population, Math.max(1, Math.ceil(deficit)));
    applyStats({ population: -starved });
    logChronicle(
      `⚠ The granaries lie empty — famine claims ${starved} ${starved === 1 ? "soul" : "souls"}.`,
      "warning"
    );
    GameState.unhappiness += 3;   // hunger breeds discontent
  }

  // Grain cannot be hoarded forever in this early era — surplus beyond a few
  // years' supply spoils in the storage pits, keeping famine a real threat.
  const grainCap = Math.max(120, needed * 5);
  if (GameState.stats.grain > grainCap) {
    applyStats({ grain: -(GameState.stats.grain - grainCap) });
  }

  // --- Pantheon: each manifested god confers its standing blessing ---
  applyPantheonPerks();

  // --- Divine Neglect: a vision left unanswered erodes the people's piety ---
  if (GameState.divineNeglect && GameState.macros.eusebeia > 0) {
    GameState.macros.eusebeia = Math.max(0, GameState.macros.eusebeia - EPIPHANY.NEGLECT);
    if (GameState.turn % 3 === 0) {
      logChronicle("The unanswered vision weighs on the people — Divine Neglect saps their piety.", "warning");
    }
  }

  // --- Renown: high Kleos draws wandering migrants; glory then fades ---
  const kleos = GameState.macros.kleos;
  if (kleos > 0) {
    const chance = Math.min(0.55, 0.04 + kleos / 400);
    if (Math.random() < chance) {
      const migrants = 2 + Math.floor(kleos / 40) + Math.floor(Math.random() * 3);
      applyStats({ population: +migrants });
      logChronicle(
        `Drawn by the renown of ${GameState.cityName}, ${migrants} wandering folk settle among you.`,
        "event"
      );
    }
    GameState.macros.kleos = Math.max(0, kleos - 1);   // glory slowly fades
  }

  // --- Civic mood: deep discontent drives families away; it then settles ---
  if (GameState.unhappiness >= 15) {
    const leavers = Math.min(GameState.stats.population, 2 + Math.floor((GameState.unhappiness - 15) / 5));
    applyStats({ population: -leavers });
    logChronicle(
      `Discontent festers; ${leavers} disillusioned ${leavers === 1 ? "soul leaves" : "souls leave"} the Demos.`,
      "warning"
    );
  }
  if (GameState.unhappiness > 0) GameState.unhappiness = Math.max(0, GameState.unhappiness - 1);
}

/**
 * THE CORE TURN FUNCTION.
 * Advances state, processes the timeline tick, rolls events and crises,
 * and writes feedback to the Chronicle. Guards against running outside
 * the PLAYING state, or while a crisis awaits a decision.
 */
function nextTurn() {
  if (GameState.status !== GameStatus.PLAYING) return;
  if (GameState.pendingCrisis || GameState.pendingFestival || GameState.pendingEpiphany) return;   // must be answered first

  // --- 1. Advance the clock ---
  GameState.turn += 1;
  GameState.year -= CONFIG.YEARS_PER_TURN;   // years count down (BC)
  GameState.lastDeltas = {};                  // reset net-change tracking

  logChronicle(`Turn ${GameState.turn} begins. The year is ${formatYear(GameState.year)}.`, "turn");

  // --- 1b. Every tenth year: the Hekatomb Festival replaces the normal tick ---
  if (GameState.turn % HEKATOMB.INTERVAL === 0) {
    openFestival();
    render();
    return;
  }

  // --- 1c. Every twelfth year (Hearth built): a Divine Epiphany ---
  if (GameState.hearthBuilt && GameState.turn % EPIPHANY.INTERVAL === 0) {
    openEpiphany();
    render();
    return;
  }

  // --- 2. Deterministic production / consumption tick ---
  processTick();

  // --- 3. Stochastic historical event (~50% chance) ---
  if (Math.random() < 0.50) {
    const ev = pick(DAWN_EVENTS);
    applyStats(ev.stats);
    logChronicle(ev.text, "event");
  }

  // --- 4. Random structural crisis (15% chance) ---
  //     The crisis opens a modal; its damage is applied on the player's choice.
  let crisisTriggered = false;
  if (Math.random() < CONFIG.CRISIS_CHANCE) {
    triggerCrisis();
    crisisTriggered = true;
  }

  // --- 5. FSM transitions: collapse or era completion ---
  if (GameState.stats.population <= 0) {
    collapse();
  } else if (GameState.year <= CONFIG.END_YEAR) {
    endEra();
  }

  // --- 6. Repaint UI (crisis modal, if any, was already opened) ---
  render();
}

/** FSM transition: PLAYING -> ENDED (successful close of the era). */
function endEra() {
  GameState.status = GameStatus.ENDED;
  logChronicle(
    `The Dawn Era draws to a close. After ${GameState.turn} years, ` +
    `${GameState.cityName} stands ready for the age to come.`,
    "system"
  );
}

/** FSM transition: PLAYING -> ENDED (the settlement has died out). */
function collapse() {
  GameState.status = GameStatus.ENDED;
  logChronicle(
    `The last hearths of ${GameState.cityName} grow cold. The settlement is abandoned.`,
    "warning"
  );
}

/* ===================================================================
   CULTURE & RELIGION — Civic Investments and Crises
   =================================================================== */

/** Spend resources outside the turn loop (clamped, no delta tracking). */
function spend(changes) {
  for (const key in changes) {
    if (!(key in GameState.stats)) continue;
    GameState.stats[key] = Math.max(0, GameState.stats[key] + changes[key]);
  }
}

/** Civic Investment: fund a travelling bard, raising Kleos at once. */
function fundBard() {
  if (GameState.status !== GameStatus.PLAYING || GameState.pendingCrisis || GameState.pendingFestival || GameState.pendingEpiphany) return;
  const c = CIVIC.bard;
  if (GameState.stats.grain < c.grain || GameState.stats.cattle < c.cattle) {
    logChronicle("There is too little to provision a travelling bard.", "warning");
    afterAction();
    return;
  }
  spend({ grain: -c.grain, cattle: -c.cattle });
  GameState.macros.kleos += c.kleos;
  logChronicle(
    `An aoidos sings the deeds of ${GameState.cityName} in far-off halls; ` +
    `its renown grows (+${c.kleos} Kleos).`,
    "event"
  );
  afterAction();
}

/** Civic Investment: raise the Ancestral Hearth (one-time; unlocks the Epiphany). */
function buildHearth() {
  if (GameState.status !== GameStatus.PLAYING || GameState.pendingCrisis || GameState.pendingFestival || GameState.pendingEpiphany) return;
  if (GameState.hearthBuilt) return;
  const c = CIVIC.hearth;
  if (GameState.stats.timber < c.timber || GameState.stats.clay < c.clay || GameState.stats.cattle < c.cattle) {
    logChronicle("The people lack the timber, clay and cattle to raise the Ancestral Hearth.", "warning");
    afterAction();
    return;
  }
  spend({ timber: -c.timber, clay: -c.clay, cattle: -c.cattle });
  GameState.hearthBuilt = true;
  logChronicle(
    `The Ancestral Hearth is kindled within a grove upon the hill. Its undying flame opens the people ` +
    `to Divine Epiphany — every twelfth year, a god may be named into the pantheon.`,
    "system"
  );
  afterAction();
}

/** Roll a random crisis and present it for the player's decision. */
function triggerCrisis() {
  const crisis = pick(CRISES);
  GameState.pendingCrisis = crisis;
  logChronicle(`A crisis befalls the Polis: ${crisis.name}!`, "warning");
  renderCrisis();
  openModal("crisis-modal");
}

/**
 * Resolve the pending crisis.
 * @param {boolean} invoke  true to Invoke Divine Favor (spend Piety);
 *                          false to Endure the full damage.
 */
function resolveCrisis(invoke) {
  const c = GameState.pendingCrisis;
  if (!c) return;

  if (invoke && GameState.macros.eusebeia >= c.pietyCost) {
    GameState.macros.eusebeia -= c.pietyCost;
    applyStats(c.mitigated);
    logChronicle(
      `The people beseech the gods with sacrifice; divine favor softens the ${c.name} ` +
      `(only ${formatChanges(c.mitigated)}).`,
      "event"
    );
  } else {
    applyStats(c.damage);
    GameState.unhappiness += 2;   // an unanswered crisis sours the people
    logChronicle(
      `Without divine favor, the ${c.name} strikes hard: ${formatChanges(c.damage)}.`,
      "warning"
    );
  }

  GameState.pendingCrisis = null;
  closeModal("crisis-modal");

  // A crisis may prove fatal.
  if (GameState.stats.population <= 0 && GameState.status === GameStatus.PLAYING) {
    collapse();
  }
  render();
}

/** Repaint everything after an administrative / civic action. */
function afterAction() {
  render();
}

/* ===================================================================
   THE HEKATOMB — a seasonal festival minigame every tenth turn
   =================================================================== */

/** Begin the festival: reset the allocation and open the (blocking) modal. */
function openFestival() {
  GameState.pendingFestival = true;
  GameState.festivalAlloc = { cattle: 0, grapes: 0, grain: 0 };
  logChronicle(
    `The year ${formatYear(GameState.year)} brings the Hekatomb Festival — ` +
    `the people gather to honour the gods.`,
    "system"
  );
  renderFestival();
  openModal("festival-modal");
}

/** Build the festival modal: three sliders feeding the three sacrificial pools. */
function renderFestival() {
  const body = document.getElementById("festival-body");
  if (!body) return;
  const s = GameState.stats, a = GameState.festivalAlloc;

  // Keep any prior allocation within current stock.
  a.cattle = Math.min(a.cattle, s.cattle);
  a.grapes = Math.min(a.grapes, s.grapes);
  a.grain  = Math.min(a.grain,  s.grain);

  body.innerHTML =
    `<p class="fest-intro">Every tenth year the Polis offers a great sacrifice — a hekatomb. ` +
    `Allocate your stores between the altar, the feast, and the winter granary. ` +
    `Whatever you keep will carry your people through the coming decade.</p>` +

    `<div class="fest-pool">` +
      `<div class="fp-title">🔥 The Altar Pool</div>` +
      `<div class="fp-desc">Cattle sacrificed upon the altar bring an immense surge of Piety (Eusebeia).</div>` +
      `<div class="fest-row"><label>🐄 Cattle to altar</label>` +
        `<input type="range" id="fest-cattle" min="0" max="${s.cattle}" value="${a.cattle}">` +
        `<span class="fest-val" id="fest-cattle-val"></span></div>` +
      `<div class="fest-gain" id="fest-altar-gain"></div>` +
    `</div>` +

    `<div class="fest-pool">` +
      `<div class="fp-title">🍷 The Feast Pool</div>` +
      `<div class="fp-desc">Wine and grain spent on a public feast bring a surge of Kleos — and renew the ` +
        `people's spirit, resetting all accumulated discontent.</div>` +
      `<div class="fest-row"><label>🍇 Wine (grapes)</label>` +
        `<input type="range" id="fest-grapes" min="0" max="${s.grapes}" value="${a.grapes}">` +
        `<span class="fest-val" id="fest-grapes-val"></span></div>` +
      `<div class="fest-row"><label>🌾 Grain</label>` +
        `<input type="range" id="fest-grain" min="0" max="${s.grain}" value="${a.grain}">` +
        `<span class="fest-val" id="fest-grain-val"></span></div>` +
      `<div class="fest-gain" id="fest-feast-gain"></div>` +
    `</div>` +

    `<div class="fest-pool fest-granary">` +
      `<div class="fp-title">🌾 The Winter Granary</div>` +
      `<div class="fp-desc">Whatever is not sacrificed remains in your stores against the coming decade.</div>` +
      `<div class="fest-leftover" id="fest-leftover"></div>` +
    `</div>` +

    `<div class="fest-warn" id="fest-warn"></div>` +
    `<div class="fest-confirm">` +
      `<button class="action-btn diplomatic" id="fest-confirm">` +
        `<span class="ab-title">🍷 Pour Libations &amp; End Festival</span>` +
        `<span class="ab-cost" id="fest-confirm-sub"></span>` +
      `</button>` +
    `</div>`;

  ["fest-cattle", "fest-grapes", "fest-grain"].forEach(id =>
    document.getElementById(id).addEventListener("input", onFestivalInput));
  document.getElementById("fest-confirm").addEventListener("click", confirmFestival);

  updateFestivalPreview();
}

/** Read the sliders into the allocation, then refresh the live preview. */
function onFestivalInput() {
  const a = GameState.festivalAlloc;
  a.cattle = +document.getElementById("fest-cattle").value;
  a.grapes = +document.getElementById("fest-grapes").value;
  a.grain  = +document.getElementById("fest-grain").value;
  updateFestivalPreview();
}

/** Show the resulting Piety/Kleos gains, the granary remainder, and warnings. */
function updateFestivalPreview() {
  const s = GameState.stats, a = GameState.festivalAlloc;
  const piety = a.cattle * HEKATOMB.pietyPerCattle;
  const kleos = Math.round(a.grapes * HEKATOMB.kleosPerGrape + a.grain * HEKATOMB.kleosPerGrain);
  const feastOffered = (a.grapes + a.grain) > 0;

  document.getElementById("fest-cattle-val").textContent = `${a.cattle} / ${s.cattle}`;
  document.getElementById("fest-grapes-val").textContent = `${a.grapes} / ${s.grapes}`;
  document.getElementById("fest-grain-val").textContent  = `${a.grain} / ${s.grain}`;

  document.getElementById("fest-altar-gain").textContent = a.cattle > 0
    ? `→ +${piety} Piety`
    : "→ the altar stands empty (the gods are slighted)";
  document.getElementById("fest-feast-gain").textContent = feastOffered
    ? `→ +${kleos} Kleos · discontent reset to 0`
    : "→ no feast is held (the people grow resentful)";

  document.getElementById("fest-leftover").innerHTML =
    `<span>🐄 <b>${s.cattle - a.cattle}</b> cattle</span>` +
    `<span>🍇 <b>${s.grapes - a.grapes}</b> grapes</span>` +
    `<span>🌾 <b>${s.grain - a.grain}</b> grain</span>`;

  const leftGrain = s.grain - a.grain;
  const yearlyNeed = Math.ceil(s.population * CONFIG.GRAIN_PER_CITIZEN);
  document.getElementById("fest-warn").textContent =
    leftGrain < yearlyNeed
      ? "⚠ Little grain remains — the granary may not hold against famine."
      : "";
}

/**
 * Validate the allocation, apply the surges/penalties, then close the
 * festival and resume normal play.
 */
function confirmFestival() {
  if (!GameState.pendingFestival) return;
  const s = GameState.stats, a = GameState.festivalAlloc;

  // Validate: clamp each pool to what is actually in store.
  a.cattle = Math.max(0, Math.min(a.cattle, s.cattle));
  a.grapes = Math.max(0, Math.min(a.grapes, s.grapes));
  a.grain  = Math.max(0, Math.min(a.grain,  s.grain));

  const pietyGain = a.cattle * HEKATOMB.pietyPerCattle;
  const kleosGain = Math.round(a.grapes * HEKATOMB.kleosPerGrape + a.grain * HEKATOMB.kleosPerGrain);
  const feastOffered = (a.grapes + a.grain) > 0;

  spend({ cattle: -a.cattle, grapes: -a.grapes, grain: -a.grain });
  GameState.macros.eusebeia += pietyGain;
  GameState.macros.kleos    += kleosGain;

  logChronicle(
    `The Hekatomb is offered: ${a.cattle} cattle, ${a.grapes} measures of wine and ` +
    `${a.grain} of grain laid before the gods.`,
    "event"
  );

  // Altar pool — piety, or a penalty for an empty altar.
  if (pietyGain > 0) {
    logChronicle(`Sacred smoke billows from the altar; the people's piety surges (+${pietyGain} Eusebeia).`, "event");
  } else {
    GameState.unhappiness += 3;
    logChronicle("The altar stood empty through the festival; the gods take note of the slight.", "warning");
  }

  // Feast pool — kleos and a reset of discontent, or a penalty for no feast.
  if (feastOffered) {
    const before = GameState.unhappiness;
    GameState.unhappiness = 0;
    logChronicle(
      `The feast renews the bonds of the Demos; renown spreads (+${kleosGain} Kleos)` +
      `${before > 0 ? `, and discontent is quelled (${before} → 0)` : ""}.`,
      "event"
    );
  } else {
    GameState.unhappiness += 5;
    logChronicle("No feast was held; the people feel slighted, and discontent festers.", "warning");
  }

  GameState.pendingFestival = false;
  closeModal("festival-modal");

  // The festival may fall on the final year of the era.
  if (GameState.stats.population <= 0) collapse();
  else if (GameState.year <= CONFIG.END_YEAR) endEra();
  render();
}

/* ---------- Modal controls ---------- */
function openModal(id)  { document.getElementById(id).hidden = false; }
function closeModal(id) { document.getElementById(id).hidden = true; }

function openLabor() { render(); openModal("labor-modal"); }
function openCivic() { renderCivic(); openModal("civic-modal"); }
function openAdmin() { renderAdmin(); openModal("admin-modal"); }
function openEpiphany() {
  GameState.pendingEpiphany = true;
  const firstEmpty = GameState.pantheon.findIndex(s => !s);
  GameState.epiphany = {
    aspects:  shuffle(Object.keys(ASPECTS)).slice(0, EPIPHANY.HAND),
    epithets: shuffle(Object.keys(EPITHETS)).slice(0, EPIPHANY.HAND),
    pickAspect: null, pickEpithet: null,
    target: firstEmpty >= 0 ? firstEmpty : 0,
  };
  logChronicle("A Divine Epiphany seizes the people at the Hearth — an Aspect and an Epithet may be bound into a god.", "system");
  renderEpiphany();
  openModal("epiphany-modal");
}

/* ---------- Pantheon helpers ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Is this Aspect+Epithet pairing harmonious (a true god) or confused? */
function isHarmonious(aspect, epithet) {
  return !!(HARMONY[aspect] && HARMONY[aspect].includes(epithet));
}

/** Human text for a deity's standing blessing. */
function perkText(epithet, harmonious) {
  if (!harmonious) return "Confused — feeble, erratic blessings.";
  switch (epithet) {
    case "georgos": return "+10 Grain each turn (rich harvests).";
    case "soter":   return "−2 Discontent each turn; steadies unrest.";
    case "agoraia": return "+3 Timber, +3 Clay, +2 Olives each turn.";
    case "xenios":  return "+2 Kleos each turn; smoother diplomacy.";
    default:        return "A standing blessing.";
  }
}

/** Build a deity object from an Aspect + Epithet pairing. */
function deityFor(aspect, epithet) {
  const harmonious = isHarmonious(aspect, epithet);
  return {
    aspect, epithet, harmonious,
    name: `${ASPECTS[aspect].god} ${EPITHETS[epithet].name}`,
    perkText: perkText(epithet, harmonious),
  };
}

/** Apply each manifested god's standing blessing for the turn. */
function applyPantheonPerks() {
  for (const d of GameState.pantheon) {
    if (!d) continue;
    const h = d.harmonious;
    switch (d.epithet) {
      case "georgos": {
        const g = h ? 10 : (Math.random() < 0.45 ? Math.floor(Math.random() * 4) : 0);
        if (g) applyStats({ grain: +g });
        break;
      }
      case "soter": {
        const u = h ? 2 : (Math.random() < 0.45 ? 1 : 0);
        if (u && GameState.unhappiness > 0) GameState.unhappiness = Math.max(0, GameState.unhappiness - u);
        if (h && GameState.unrest > 0) GameState.unrest = Math.max(0, GameState.unrest - 1);
        break;
      }
      case "agoraia": {
        if (h) applyStats({ timber: +3, clay: +3, olives: +2 });
        else if (Math.random() < 0.45) applyStats({ [pick(["timber", "clay", "olives", "grapes"])]: +Math.floor(Math.random() * 4) });
        break;
      }
      case "xenios": {
        const k = h ? 2 : (Math.random() < 0.45 ? 1 : 0);
        if (k) GameState.macros.kleos += k;
        break;
      }
    }
  }
}

/** Bonus to annexation success granted by harmonious Xenios gods. */
function pantheonAnnexBonus() {
  let b = 0;
  for (const d of GameState.pantheon) if (d && d.epithet === "xenios" && d.harmonious) b += 0.12;
  return Math.min(0.3, b);
}

/** Consecrate the bound Aspect+Epithet into the chosen pantheon slot. */
function consecrateDeity() {
  const ep = GameState.epiphany;
  if (!ep || !ep.pickAspect || !ep.pickEpithet) return;
  const d = deityFor(ep.pickAspect, ep.pickEpithet);
  const slot = (ep.target >= 0 && ep.target < EPIPHANY.SLOTS) ? ep.target : 0;
  const replaced = GameState.pantheon[slot];
  GameState.pantheon[slot] = d;

  GameState.divineNeglect = false;
  GameState.pendingEpiphany = false;
  GameState.epiphany = null;
  closeModal("epiphany-modal");

  logChronicle(
    `${d.name} is named into the pantheon${replaced ? `, displacing ${replaced.name}` : ""}. ` +
    (d.harmonious
      ? `The pairing is harmonious — ${d.perkText}`
      : `The pairing is ill-matched — a confused god of fickle, feeble blessings.`),
    d.harmonious ? "event" : "warning"
  );

  if (GameState.stats.population <= 0) collapse();
  else if (GameState.year <= CONFIG.END_YEAR) endEra();
  render();
}

/** Turn the vision away — no god is named, and Divine Neglect sets in. */
function dismissEpiphany() {
  GameState.pendingEpiphany = false;
  GameState.epiphany = null;
  GameState.divineNeglect = true;
  closeModal("epiphany-modal");
  logChronicle(
    "The vision is turned away; no god is named. Divine Neglect begins to gnaw at the people's piety.",
    "warning"
  );
  if (GameState.year <= CONFIG.END_YEAR) endEra();
  render();
}

/* ---------- Epiphany card interactions ---------- */
function epiphanyPick(kind, id) {
  if (!GameState.epiphany) return;
  if (kind === "aspect") GameState.epiphany.pickAspect = id;
  else GameState.epiphany.pickEpithet = id;
  renderEpiphany();
}
function epiphanyClearSlot(kind) {
  if (!GameState.epiphany) return;
  if (kind === "aspect") GameState.epiphany.pickAspect = null;
  else GameState.epiphany.pickEpithet = null;
  renderEpiphany();
}

/* ===================================================================
   SYNOIKISMOS — uniting neighbouring hamlets into the Polis
   =================================================================== */

/** Look up a runtime hamlet by id. */
function getHamlet(id) {
  return GameState.hamlets.find(h => h.id === id);
}

/** Human-readable description of a bonus, e.g. "+8 Grain, +6 Clay / turn". */
function bonusText(bonus) {
  return Object.keys(bonus)
    .map(k => `+${bonus[k]} ${STAT_META[k] ? STAT_META[k].label : k}`)
    .join(", ") + " / turn";
}

/**
 * Fold an absorbed hamlet into the Polis: its people join the city pool
 * and its unique asset becomes a permanent per-turn generation bonus.
 */
function absorbHamlet(h) {
  h.absorbed = true;
  GameState.stats.population += h.population;   // join the main city pool
  for (const key in h.asset.bonus) {
    GameState.bonuses[key] = (GameState.bonuses[key] || 0) + h.asset.bonus[key];
  }
  logChronicle(
    `${h.name} joins ${GameState.cityName} through synoikismos — ${h.population} souls ` +
    `and their gift of ${h.asset.label} now enrich the Polis.`,
    "system"
  );
}

/** Diplomatic Feast: high wine + cattle cost, but certain success. */
function attemptFeast(id) {
  if (GameState.status !== GameStatus.PLAYING || GameState.pendingCrisis || GameState.pendingFestival || GameState.pendingEpiphany) return;
  const h = getHamlet(id);
  if (!h || h.absorbed) return;
  const c = h.feast;

  if (GameState.stats.grapes < c.grapes || GameState.stats.cattle < c.cattle) {
    logChronicle(`The feast for ${h.name} cannot be laid — too little wine and cattle.`, "warning");
    afterAction();
    return;
  }
  spend({ grapes: -c.grapes, cattle: -c.cattle });
  logChronicle(`A great feast of wine and roasted cattle wins the favour of ${h.name}.`, "event");
  absorbHamlet(h);
  afterAction();
}

/**
 * Coercive Annexation — a grinding, multi-turn siege. Each push costs cattle
 * and supplies and, if it lands, wears down one point of the hamlet's
 * resistance; only when its resistance is fully broken does the hamlet fall.
 * A hamlet may be pushed only once every ANNEX_COOLDOWN turns, so subduing
 * one by force is the work of many turns, never a couple.
 */
function attemptAnnex(id) {
  if (GameState.status !== GameStatus.PLAYING || GameState.pendingCrisis || GameState.pendingFestival || GameState.pendingEpiphany) return;
  const h = getHamlet(id);
  if (!h || h.absorbed) return;
  const c = h.annex;

  // The host must regroup between assaults — at most one push per turn.
  if (GameState.turn - h.lastPush < CONFIG.ANNEX_COOLDOWN) {
    logChronicle(`The warriors marching on ${h.name} must regroup — end the turn before pressing the assault again.`, "warning");
    afterAction();
    return;
  }
  if (GameState.stats.cattle < c.cattle || GameState.stats.grain < c.grain) {
    logChronicle(`The muster against ${h.name} falters — not enough cattle and supplies.`, "warning");
    afterAction();
    return;
  }
  // Manpower and supplies are committed whether or not the push succeeds.
  spend({ cattle: -c.cattle, grain: -c.grain });
  h.lastPush = GameState.turn;

  if (Math.random() < Math.min(0.95, CONFIG.ANNEX_SUCCESS + pantheonAnnexBonus())) {
    h.siege += 1;
    if (h.siege >= h.resistance) {
      logChronicle(`After a long campaign, the warriors of the Demos finally bring ${h.name} to heel by force.`, "event");
      absorbHamlet(h);
    } else {
      logChronicle(
        `Another stronghold of ${h.name} falls (${h.siege} / ${h.resistance}), but its people fight on.`,
        "event"
      );
    }
  } else {
    // A repulsed assault costs ground already won, and breeds resentment.
    if (h.siege > 0) h.siege -= 1;
    GameState.unrest = CONFIG.UNREST_TURNS;
    GameState.unhappiness += 4;   // a failed assault breeds discontent
    logChronicle(
      `The assault on ${h.name} is thrown back! Resentment spreads — ` +
      `civil unrest will sap production for ${CONFIG.UNREST_TURNS} turns.`,
      "warning"
    );
  }
  afterAction();
}

/* ===================================================================
   RENDERING
   =================================================================== */

/** Repaint the HUD, resource panel, labour panel, map and civic views. */
function render() {
  // Top bar
  document.getElementById("city-name").textContent = `by Penguin`;
  document.getElementById("hud-kleos").textContent    = GameState.macros.kleos;
  document.getElementById("hud-eusebeia").textContent = GameState.macros.eusebeia;
  const dis = document.getElementById("hud-discontent");
  dis.textContent = GameState.unhappiness;
  dis.style.color = GameState.unhappiness >= 12 ? "#e07a5f"
                  : GameState.unhappiness >= 6  ? "#d6a44a" : "#9bbf6a";
  document.getElementById("hud-year").textContent  = formatYear(GameState.year);
  document.getElementById("hud-turn").textContent  = GameState.turn;
  document.getElementById("hud-phase").textContent = GameState.phase;

  // Resource panel
  const body = document.getElementById("stats-body");
  body.innerHTML = "";
  for (const key in GameState.stats) {
    const meta = STAT_META[key] || { icon: "•", label: key, sub: "" };
    const delta = GameState.lastDeltas[key] || 0;

    let deltaClass = "zero", deltaText = "—";
    if (delta > 0) { deltaClass = "pos"; deltaText = `+${delta}`; }
    else if (delta < 0) { deltaClass = "neg"; deltaText = `${delta}`; }

    const row = document.createElement("div");
    row.className = "stat-row";
    row.innerHTML =
      `<span class="stat-name">` +
        `<span class="stat-icon">${meta.icon}</span>` +
        `<span><div>${meta.label}</div><div class="stat-sub">${meta.sub}</div></span>` +
      `</span>` +
      `<span class="stat-figures">` +
        `<span class="stat-val">${GameState.stats[key]}</span>` +
        `<span class="delta ${deltaClass}">${deltaText}</span>` +
      `</span>`;
    body.appendChild(row);
  }

  // Labour allocation panel.
  renderLabor();

  // Reveal the Ancestral Hearth on the hill once it has been kindled.
  const hearth = document.getElementById("scene-hearth");
  if (hearth) hearth.style.display = GameState.hearthBuilt ? "" : "none";

  // Map, civic and administration views.
  renderMap();
  renderCivic();
  renderAdmin();

  // Control panel reflects the FSM and any pending crisis.
  const btn = document.getElementById("end-turn-btn");
  const hint = document.getElementById("control-hint");
  if (GameState.status === GameStatus.ENDED) {
    btn.disabled = true;
    btn.textContent = "Era Complete";
    hint.textContent = GameState.stats.population <= 0
      ? "The Demos is no more. Refresh to begin anew."
      : "The Dawn Era has ended. A new age awaits in a future phase.";
  } else if (GameState.pendingCrisis || GameState.pendingFestival || GameState.pendingEpiphany) {
    btn.disabled = true;
    btn.textContent = "End Turn";
    hint.textContent = GameState.pendingFestival ? "The Hekatomb Festival awaits your offerings."
      : GameState.pendingEpiphany ? "A Divine Epiphany awaits — name a god, or turn the vision away."
      : "A crisis demands your answer before the year may turn.";
  } else {
    btn.disabled = false;
    btn.textContent = "End Turn";
    hint.textContent = "Advance the chronicle one year at a time.";
  }
}

/** Render the Labor panel: sliders to distribute citizens among the trades. */
function renderLabor() {
  const body = document.getElementById("labor-body");
  if (!body) return;
  const alloc = GameState.jobAllocation;

  let rows = "";
  for (const key in JOBS) {
    const job = JOBS[key];
    rows +=
      `<div class="job-alloc">` +
        `<span class="ja-icon">${job.icon}</span>` +
        `<span class="ja-name">${job.name}<small>${job.yields}</small></span>` +
        `<input type="range" min="0" max="100" value="${alloc[key] || 0}" data-job="${key}" class="ja-range">` +
        `<span class="ja-count" id="ja-count-${key}"></span>` +
      `</div>`;
  }

  body.innerHTML =
    `<p class="admin-intro">Distribute your citizens among the trades. In these early years the ` +
    `<b>vast majority must farm</b>, or the granaries will run dry. Weights are relative; the head-counts ` +
    `update live and take effect from the next turn.</p>` +
    rows +
    `<div class="ja-balance" id="ja-balance"></div>` +
    `<div class="ja-foot"><span id="ja-total"></span>` +
      `<button class="map-btn" id="labor-reset">Reset to recommended</button></div>`;

  body.querySelectorAll(".ja-range").forEach(r => r.addEventListener("input", onLaborInput));
  document.getElementById("labor-reset").addEventListener("click", () => {
    GameState.jobAllocation = { ...DEFAULT_ALLOC };
    body.querySelectorAll(".ja-range").forEach(r =>
      { r.value = GameState.jobAllocation[r.getAttribute("data-job")] || 0; });
    GameState.jobs = assignJobs(GameState.stats.population);
    updateLaborReadout();
  });

  updateLaborReadout();
}

/** A labour slider moved: update the weight, recompute counts, refresh readouts. */
function onLaborInput(e) {
  GameState.jobAllocation[e.target.getAttribute("data-job")] = +e.target.value;
  GameState.jobs = assignJobs(GameState.stats.population);
  updateLaborReadout();
}

/** Refresh the live head-counts, percentages and grain outlook (no slider rebuild). */
function updateLaborReadout() {
  const pop = GameState.stats.population, alloc = GameState.jobAllocation;
  let total = 0;
  for (const key in JOBS) total += (alloc[key] || 0);
  if (total <= 0) total = 1;
  const counts = assignJobs(pop);

  for (const key in JOBS) {
    const el = document.getElementById(`ja-count-${key}`);
    if (el) el.innerHTML = `<b>${counts[key]}</b> · ${Math.round((alloc[key] || 0) / total * 100)}%`;
  }

  const grainProd = counts.farmers * YIELD.grain + (GameState.bonuses.grain || 0);
  const grainNeed = Math.ceil(pop * CONFIG.GRAIN_PER_CITIZEN);
  const bal = grainProd - grainNeed;
  const balEl = document.getElementById("ja-balance");
  if (balEl) {
    balEl.className = "ja-balance " + (bal >= 0 ? "good" : "bad");
    balEl.innerHTML = bal >= 0
      ? `🌾 Harvest outlook: <b>${grainProd}</b> grain grown vs <b>${grainNeed}</b> eaten — a surplus of +${bal}/yr.`
      : `⚠ Harvest outlook: <b>${grainProd}</b> grain grown vs <b>${grainNeed}</b> eaten — a shortfall of ${bal}/yr; famine looms.`;
  }
  const tot = document.getElementById("ja-total");
  if (tot) tot.textContent = `👥 ${pop} citizens`;
}

/** Render the interactive overlay (labels) atop the painted map scene. */
function renderMap() {
  const overlay = document.getElementById("map-overlay");
  if (!overlay) return;
  overlay.innerHTML = "";

  // Civil-unrest banner.
  if (GameState.unrest > 0) {
    const banner = document.createElement("div");
    banner.id = "unrest-banner";
    banner.textContent =
      `⚠ Civil unrest — production reduced for ` +
      `${GameState.unrest} ${GameState.unrest === 1 ? "turn" : "turns"}`;
    overlay.appendChild(banner);
  }

  // The central Polis label (sits below the painted hilltop village).
  const polis = document.createElement("div");
  polis.className = "map-label polis";
  polis.style.left = "50%";
  polis.style.top  = "60%";
  polis.innerHTML =
    `<div class="ml-name">🏛️ ${GameState.cityName}</div>` +
    `<div class="ml-sub">${GameState.stats.population} souls</div>`;
  overlay.appendChild(polis);

  // Labels for the still-independent hamlets. Once a hamlet is integrated its
  // text box disappears, leaving only its physical huts painted on the land.
  GameState.hamlets.forEach(h => {
    if (h.absorbed) return;
    const m = document.createElement("div");
    m.className = "map-label hamlet";
    m.style.left = h.pos.left;
    m.style.top  = h.pos.top;
    m.innerHTML =
      `<div class="ml-name">${h.icon} ${h.name}</div>` +
      `<div class="ml-sub">${h.population} souls · click to unite</div>`;
    m.title = "Open Administration to unite this hamlet";
    m.addEventListener("click", openAdmin);
    overlay.appendChild(m);
  });

  // Update the Administration badge with the count of free hamlets.
  const badge = document.getElementById("admin-badge");
  if (badge) {
    const remaining = GameState.hamlets.filter(h => !h.absorbed).length;
    badge.textContent = remaining;
    badge.style.display = remaining ? "" : "none";
  }
}

/** Render the Divine Epiphany modal: draw the hand and wire the shrine. */
function renderEpiphany() {
  const body = document.getElementById("epiphany-body");
  const ep = GameState.epiphany;
  if (!body || !ep) return;

  const card = (kind, id) => {
    const data = kind === "aspect" ? ASPECTS[id] : EPITHETS[id];
    const picked = (kind === "aspect" ? ep.pickAspect : ep.pickEpithet) === id;
    return `<div class="god-card ${kind}${picked ? " picked" : ""}" draggable="true" data-kind="${kind}" data-id="${id}">` +
      `<div class="gc-icon">${data.icon}</div><div class="gc-name">${data.name}</div>` +
      `<div class="gc-sub">${data.sub}</div><div class="gc-desc">${data.desc}</div></div>`;
  };
  const aspectCards  = ep.aspects.map(id => card("aspect", id)).join("");
  const epithetCards = ep.epithets.map(id => card("epithet", id)).join("");

  const filled = (kind) => {
    const id = kind === "aspect" ? ep.pickAspect : ep.pickEpithet;
    if (!id) return `<span class="slot-hint">drag an<br>${kind === "aspect" ? "Aspect" : "Epithet"}<br>here</span>`;
    const data = kind === "aspect" ? ASPECTS[id] : EPITHETS[id];
    return `<div class="gc-icon">${data.icon}</div><div class="gc-name">${data.name}</div><div class="gc-sub">${data.sub}</div>`;
  };

  let preview = `<div class="deity-name">— · —</div><div class="deity-tag">awaiting both cards</div>`;
  let canConsecrate = false;
  if (ep.pickAspect && ep.pickEpithet) {
    const d = deityFor(ep.pickAspect, ep.pickEpithet);
    preview = `<div class="deity-name">${d.name}</div>` +
      `<div class="deity-tag ${d.harmonious ? "harmonious" : "confused"}">${d.harmonious ? "✦ Harmonious" : "≈ Confused pairing"}</div>` +
      `<div class="deity-perk">${d.perkText}</div>`;
    canConsecrate = true;
  }

  let slots = "";
  for (let i = 0; i < EPIPHANY.SLOTS; i++) {
    const d = GameState.pantheon[i];
    slots += `<div class="pan-slot${i === ep.target ? " target" : ""}${d ? " filled" : ""}" data-slot="${i}">` +
      (d ? `<div class="pan-name">${d.name}</div><div class="pan-perk">${d.harmonious ? "✦ " + EPITHETS[d.epithet].sub : "≈ confused"}</div>`
         : `<div class="pan-empty">empty slot ${i + 1}</div>`) + `</div>`;
  }

  body.innerHTML =
    `<p class="admin-intro">A god stirs at the Hearth. Bind one <b>Aspect</b> (a force of nature) to one <b>Epithet</b> ` +
    `(its work for your town), then consecrate it into a pantheon slot. Harmonious pairings give strong, steady ` +
    `blessings; ill-matched ones yield a confused, fickle god. Turn the vision away and Divine Neglect will gnaw at your Piety.</p>` +
    `<div class="deck-label">Aspects — the untamed forces</div><div class="deck">${aspectCards}</div>` +
    `<div class="shrine">` +
      `<div class="shrine-slot ${ep.pickAspect ? "filled" : ""}" data-drop="aspect">${filled("aspect")}</div>` +
      `<span class="shrine-op">✛</span>` +
      `<div class="shrine-slot ${ep.pickEpithet ? "filled" : ""}" data-drop="epithet">${filled("epithet")}</div>` +
      `<span class="shrine-op">➜</span>` +
      `<div class="deity-preview">${preview}</div>` +
    `</div>` +
    `<div class="deck-label">Epithets — the divine titles</div><div class="deck">${epithetCards}</div>` +
    `<div class="deck-label">Your pantheon — choose a slot to receive the god</div>` +
    `<div class="pantheon-slots">${slots}</div>` +
    `<div class="epiphany-actions">` +
      `<button class="action-btn diplomatic" id="ep-consecrate" ${canConsecrate ? "" : "disabled"}>` +
        `<span class="ab-title">⛩️ Consecrate into the Pantheon</span><span class="ab-cost">Locks this god into the chosen slot</span></button>` +
      `<button class="action-btn" id="ep-dismiss">` +
        `<span class="ab-title">🌫️ Turn Away the Vision</span><span class="ab-cost">No god is named — risks Divine Neglect</span></button>` +
    `</div>`;

  // Cards: click to place, or drag to a shrine slot.
  body.querySelectorAll(".god-card").forEach(c => {
    c.addEventListener("click", () => epiphanyPick(c.dataset.kind, c.dataset.id));
    c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.kind + ":" + c.dataset.id); c.classList.add("dragging"); });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
  });
  body.querySelectorAll(".shrine-slot").forEach(slot => {
    slot.addEventListener("dragover", e => { e.preventDefault(); slot.classList.add("over"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("over"));
    slot.addEventListener("drop", e => {
      e.preventDefault(); slot.classList.remove("over");
      const [kind, id] = (e.dataTransfer.getData("text/plain") || "").split(":");
      if (kind === slot.dataset.drop && id) epiphanyPick(kind, id);
    });
    slot.addEventListener("click", () => epiphanyClearSlot(slot.dataset.drop));
  });
  body.querySelectorAll(".pan-slot").forEach(s =>
    s.addEventListener("click", () => { GameState.epiphany.target = +s.dataset.slot; renderEpiphany(); }));
  document.getElementById("ep-consecrate").addEventListener("click", consecrateDeity);
  document.getElementById("ep-dismiss").addEventListener("click", dismissEpiphany);
}

/** Render the pending crisis into the (non-dismissable) crisis modal. */
function renderCrisis() {
  const c = GameState.pendingCrisis;
  const body = document.getElementById("crisis-body");
  if (!c || !body) return;

  const canInvoke = GameState.macros.eusebeia >= c.pietyCost;

  body.innerHTML =
    `<div class="crisis-head"><span class="crisis-icon">${c.icon}</span>` +
      `<span class="crisis-name">${c.name}</span></div>` +
    `<p class="crisis-desc">${c.desc}</p>` +
    `<div class="crisis-threat">Unchecked, this would cost the Polis: <b>${formatChanges(c.damage)}</b></div>` +
    `<div class="crisis-actions">` +
      `<button class="action-btn diplomatic" id="crisis-invoke" ${canInvoke ? "" : "disabled"}>` +
        `<span class="ab-title">🙏 Invoke Divine Favor</span>` +
        `<span class="ab-cost">` +
          (canInvoke
            ? `Spend 🔥 ${c.pietyCost} Piety — losses softened to ${formatChanges(c.mitigated)}`
            : `Requires 🔥 ${c.pietyCost} Piety (you have ${GameState.macros.eusebeia})`) +
        `</span>` +
      `</button>` +
      `<button class="action-btn" id="crisis-endure">` +
        `<span class="ab-title">🛡 Endure the Crisis</span>` +
        `<span class="ab-cost">Suffer the full toll: ${formatChanges(c.damage)}</span>` +
      `</button>` +
    `</div>`;

  document.getElementById("crisis-invoke").addEventListener("click", () => resolveCrisis(true));
  document.getElementById("crisis-endure").addEventListener("click", () => resolveCrisis(false));
}

/** Render the Administration (Synoikismos) modal body. */
function renderAdmin() {
  const body = document.getElementById("admin-body");
  if (!body) return;

  const remaining = GameState.hamlets.filter(h => !h.absorbed);
  if (remaining.length === 0) {
    body.innerHTML =
      `<div class="admin-done">⚖ Synoikismos complete — every neighbouring ` +
      `hamlet has joined ${GameState.cityName}.</div>`;
    return;
  }

  let html =
    `<p class="admin-intro">Unite the surrounding hamlets into the Polis. Win them over with a ` +
    `long, lavish feast, or grind them down by force — a siege of many turns that breeds unrest with every repulse.</p>`;

  remaining.forEach(h => {
    const f = h.feast, a = h.annex;
    const canFeast = GameState.stats.grapes >= f.grapes && GameState.stats.cattle >= f.cattle;
    const ended = GameState.status !== GameStatus.PLAYING || !!GameState.pendingCrisis || !!GameState.pendingFestival || !!GameState.pendingEpiphany;
    const regrouping = GameState.turn - h.lastPush < CONFIG.ANNEX_COOLDOWN;
    const canAnnex = GameState.stats.cattle >= a.cattle && GameState.stats.grain >= a.grain && !regrouping;
    const pct = Math.round(Math.min(0.95, CONFIG.ANNEX_SUCCESS + pantheonAnnexBonus()) * 100);
    const siegeNote = h.siege > 0
      ? `<div class="hc-asset">Resistance broken: <b>${h.siege} / ${h.resistance}</b> — ${h.resistance - h.siege} more to subdue</div>`
      : `<div class="hc-asset">By force: <b>${h.resistance} successful pushes</b> needed, one per turn</div>`;

    html +=
      `<div class="hamlet-card">` +
        `<div class="hc-head">` +
          `<span class="hc-name">${h.icon} ${h.name}</span>` +
          `<span class="hc-pop">${h.population} souls</span>` +
        `</div>` +
        `<div class="hc-desc">${h.desc}</div>` +
        `<div class="hc-asset">Asset once absorbed: <b>${bonusText(h.asset.bonus)}</b></div>` +
        siegeNote +
        `<div class="hamlet-actions">` +
          `<button class="action-btn diplomatic" data-feast="${h.id}" ${(!canFeast || ended) ? "disabled" : ""}>` +
            `<span class="ab-title">🍷 Diplomatic Feast</span>` +
            `<span class="ab-cost">🍇 ${f.grapes} wine · 🐄 ${f.cattle} cattle — certain success</span>` +
          `</button>` +
          `<button class="action-btn" data-annex="${h.id}" ${(!canAnnex || ended) ? "disabled" : ""}>` +
            `<span class="ab-title">⚔ Press the Siege</span>` +
            `<span class="ab-cost">🐄 ${a.cattle} cattle · 🌾 ${a.grain} supplies — ${pct}% per push` +
              `${regrouping ? " · regrouping, end the turn" : ""}</span>` +
          `</button>` +
        `</div>` +
      `</div>`;
  });

  body.innerHTML = html;

  // Wire the action buttons.
  body.querySelectorAll("[data-feast]").forEach(btn =>
    btn.addEventListener("click", () => attemptFeast(btn.getAttribute("data-feast"))));
  body.querySelectorAll("[data-annex]").forEach(btn =>
    btn.addEventListener("click", () => attemptAnnex(btn.getAttribute("data-annex"))));
}

/** Append a single chronicle entry to the log panel and scroll into view. */
function renderLogEntry(entry) {
  const log = document.getElementById("chronicle-log");
  const cls = entry.kind === "event"   ? " log-event"
            : entry.kind === "system"  ? " log-system"
            : entry.kind === "warning" ? " log-warning" : "";
  const el = document.createElement("div");
  el.className = "log-entry" + cls;
  el.innerHTML =
    `<span class="log-year">${formatYear(entry.year)}</span>` +
    `<span class="log-text">${entry.text}</span>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

/* ===================================================================
   BOOTSTRAP
   =================================================================== */

function initGame() {
  GameState.status = GameStatus.PLAYING;   // FSM: BOOT -> PLAYING
  GameState.jobAllocation = { ...DEFAULT_ALLOC };
  GameState.jobs = assignJobs(GameState.stats.population);

  // Seed the runtime hamlets from config (deep copy so config stays pristine).
  GameState.hamlets = HAMLETS.map(h => ({ ...h, absorbed: false, siege: 0, lastPush: -99 }));
  GameState.bonuses = {};
  GameState.unrest = 0;
  GameState.hearthBuilt = false;
  GameState.pendingEpiphany = false;
  GameState.pantheon = [null, null, null];
  GameState.divineNeglect = false;
  GameState.epiphany = null;
  GameState.pendingCrisis = null;
  GameState.pendingFestival = false;
  GameState.festivalAlloc = { cattle: 0, grapes: 0, grain: 0 };
  GameState.unhappiness = 0;
  GameState.macros = { kleos: 0, eusebeia: 0 };

  render();
  logChronicle(
    `In the year ${formatYear(CONFIG.START_YEAR)}, a scattering of families ` +
    `founds the settlement of ${GameState.cityName} upon the dry hills.`,
    "system"
  );
  logChronicle("Farmers sow grain, herders tend cattle, and the kilns are lit.", "system");
  logChronicle(
    "Bards may spread your renown and an altar may court the gods — open Civic Investments. " +
    "Three independent hamlets dwell nearby; through synoikismos they may join the Polis.",
    "system"
  );
  logChronicle("Every tenth year the people hold the Hekatomb, a great sacrifice to renew the Polis.", "system");
  logChronicle("In time, raise an Ancestral Hearth to open your people to Divine Epiphany and name your first gods.", "system");
  logChronicle("The Dawn Era begins. Press “End Turn” to let the years unfold.", "system");

  // End Turn.
  document.getElementById("end-turn-btn").addEventListener("click", nextTurn);

  // Map tools: open the Labor, Civic and Administration modals.
  document.getElementById("open-labor").addEventListener("click", openLabor);
  document.getElementById("open-civic").addEventListener("click", openCivic);
  document.getElementById("open-admin").addEventListener("click", openAdmin);

  // Chronicle enlarge / shrink toggle.
  document.getElementById("chron-enlarge").addEventListener("click", () => {
    const vp = document.getElementById("viewport");
    vp.classList.toggle("chron-lg");
    document.getElementById("chron-enlarge").textContent =
      vp.classList.contains("chron-lg") ? "⤡ Shrink" : "⤢ Enlarge";
  });

  // Modal close buttons.
  document.querySelectorAll(".modal-close").forEach(btn =>
    btn.addEventListener("click", () => closeModal(btn.getAttribute("data-close"))));

  // Backdrop clicks dismiss modals — except the crisis and festival modals,
  // which must be resolved before play resumes.
  const blocking = ["crisis-modal", "festival-modal", "epiphany-modal"];
  document.querySelectorAll(".modal-backdrop").forEach(back =>
    back.addEventListener("click", e => {
      if (e.target === back && !blocking.includes(back.id)) back.hidden = true;
    }));
}

window.addEventListener("DOMContentLoaded", initGame);
</script>
</body>
</html>
