<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demos — The Dawn Era</title>
<style>
  /* ===========================================================
     Demos — Phase 1: The Dawn Era (900 BC – 750 BC)
     Single-file prototype.
     Aesthetic: ancient & rustic — parchment, terracotta, ochre,
     carved stone and inked serif lettering.
     =========================================================== */

  :root {
    /* Earth & parchment palette */
    --soil:      #241a12;   /* deep tilled earth (page) */
    --stone:     #1c1510;   /* carved stone (top bar) */
    --parch:     #e9dcbe;   /* parchment panels */
    --parch-2:   #e0d1ad;   /* parchment, shaded */
    --ink:       #3a2a19;   /* iron-gall ink (text on parchment) */
    --ink-soft:  #6d5238;   /* faded ink */
    --terra:     #a8492c;   /* terracotta accent */
    --terra-dark:#7c3520;   /* fired terracotta, shaded */
    --ochre:     #b07d2b;   /* ochre / aged gold */
    --olive:     #6f7536;   /* olive green */
    --good:      #5b7a2c;   /* growth (olive green) */
    --bad:       #9d3320;   /* decline (terracotta red) */
    --border:    #b6985f;   /* aged brass border */
    --border-d:  #8a6f3e;
    --shadow:    0 6px 16px rgba(0,0,0,.45);
    --font-serif:"Iowan Old Style","Palatino Linotype","Book Antiqua","Georgia",serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--soil);
    color: var(--ink);
    font-family: var(--font-serif);
    overflow: hidden;
  }

  /* Rough tilled-earth texture for the page backdrop */
  body {
    display: flex;
    flex-direction: column;
    background-color: var(--soil);
    background-image:
      repeating-linear-gradient(0deg,   rgba(0,0,0,.18) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg,  rgba(255,220,160,.03) 0 1px, transparent 1px 6px),
      radial-gradient(circle at 30% 20%, #2e2117, #1d140d 80%);
  }

  /* ---------- Top Bar: a carved stone lintel ---------- */
  #top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, #2a201700, #00000040),
      var(--stone);
    border-bottom: 4px solid var(--terra-dark);
    box-shadow: 0 4px 0 #120c08, var(--shadow);
    z-index: 2;
  }

  #title-block { display: flex; align-items: baseline; gap: 14px; }

  #title-block h1 {
    font-size: 26px;
    letter-spacing: 7px;
    color: var(--ochre);
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #000, 0 0 10px rgba(176,125,43,.25);
  }

  #city-name {
    font-size: 15px;
    color: #c9b489;
    font-style: italic;
    letter-spacing: 1px;
  }

  #status-readout { display: flex; gap: 10px; }

  .stat-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 96px;
    padding: 4px 12px;
    border-left: 1px solid #44372a;
  }
  .stat-chip:first-child { border-left: none; }

  .stat-chip .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #93805f;
  }
  .stat-chip .value {
    font-size: 22px;
    color: #e9dcbe;
    margin-top: 3px;
    text-shadow: 1px 1px 0 #000;
  }
  .stat-chip .value.phase { color: var(--ochre); font-size: 15px; font-style: italic; }

  /* ---------- Main Viewport ---------- */
  #viewport {
    flex: 1;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 18px;
    padding: 18px 28px;
    min-height: 0;
  }

  #right-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 0;
  }

  /* Parchment panels with an aged, double-ruled border */
  .panel {
    background:
      repeating-linear-gradient(0deg, rgba(120,90,40,.04) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, var(--parch), var(--parch-2));
    border: 2px solid var(--border);
    outline: 2px solid var(--border-d);
    outline-offset: 2px;
    border-radius: 3px;
    box-shadow: var(--shadow), inset 0 0 40px rgba(140,105,55,.18);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-header {
    padding: 11px 16px;
    border-bottom: 2px solid var(--border-d);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--terra-dark);
    font-weight: 700;
    font-variant: small-caps;
    background: linear-gradient(180deg, rgba(176,125,43,.14), transparent);
  }

  .panel-body { padding: 14px 16px; overflow-y: auto; flex: 1; }

  /* ---------- Resource rows ---------- */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 4px;
    border-bottom: 1px dotted var(--border-d);
  }
  .stat-row:last-child { border-bottom: none; }

  .stat-row .stat-name {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--ink);
    font-size: 15px;
  }
  .stat-row .stat-icon { font-size: 19px; width: 22px; text-align: center; }
  .stat-row .stat-sub { font-size: 11px; color: var(--ink-soft); font-style: italic; }

  .stat-figures { display: flex; align-items: baseline; gap: 10px; }
  .stat-row .stat-val {
    font-size: 21px;
    color: var(--ink);
    font-weight: 700;
    min-width: 46px;
    text-align: right;
  }

  /* Net-change text indicators: "+5" / "-2" */
  .delta {
    font-size: 13px;
    font-weight: 700;
    min-width: 34px;
    text-align: left;
    font-style: italic;
  }
  .delta.pos { color: var(--good); }
  .delta.neg { color: var(--bad); }
  .delta.zero { color: var(--ink-soft); opacity: .55; }

  /* ---------- Labour (job assignments) panel ---------- */
  #labor-panel { flex: 0 0 auto; }
  #labor-body {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 14px 16px;
  }
  .job-card {
    text-align: center;
    padding: 10px 6px;
    background: rgba(255,255,255,.18);
    border: 1px solid var(--border-d);
    border-radius: 3px;
    box-shadow: inset 0 0 12px rgba(140,105,55,.15);
  }
  .job-card .job-icon { font-size: 22px; }
  .job-card .job-count { font-size: 20px; font-weight: 700; color: var(--ink); }
  .job-card .job-name {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-variant: small-caps;
  }

  /* ---------- Map placeholder: a dirt plot ---------- */
  #map-panel { flex: 1 1 auto; }
  #map-panel .panel-body { padding: 0; position: relative; }
  #map-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background:
      repeating-linear-gradient(45deg, rgba(124,53,32,.07) 0 22px, rgba(110,117,54,.06) 22px 44px);
    color: var(--ink-soft);
    text-align: center;
  }
  #map-placeholder .glyph { font-size: 54px; opacity: .4; }
  #map-placeholder p { font-size: 14px; max-width: 340px; line-height: 1.55; color: var(--ink); }
  #map-placeholder .hint { font-size: 12px; font-style: italic; opacity: .7; }

  /* ---------- Control Panel: a stone shelf ---------- */
  #control-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 28px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 9px),
      var(--stone);
    border-top: 3px solid var(--terra-dark);
  }
  #control-hint { font-size: 13px; color: #b6a079; font-style: italic; }

  /* End Turn: a fired-clay tablet */
  #end-turn-btn {
    font-family: var(--font-serif);
    font-size: 17px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-variant: small-caps;
    font-weight: 700;
    color: #f3e6c8;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, var(--terra), var(--terra-dark));
    border: 2px solid #5e2616;
    border-radius: 4px;
    padding: 12px 38px;
    cursor: pointer;
    transition: transform .08s ease, filter .15s ease, box-shadow .15s ease;
    box-shadow: 0 4px 0 #4d1f12, var(--shadow);
    text-shadow: 1px 1px 0 #3a160c;
  }
  #end-turn-btn:hover  { filter: brightness(1.08); }
  #end-turn-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4d1f12; }
  #end-turn-btn:disabled {
    filter: grayscale(.55) brightness(.7);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ---------- Chronicle Log: an unrolled scroll ---------- */
  #chronicle {
    height: 210px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--parch), var(--parch-2));
    border-top: 3px solid var(--border-d);
  }
  #chronicle .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--border-d);
  }
  #chronicle-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 28px 16px;
    font-size: 14px;
    line-height: 1.6;
    background-image: repeating-linear-gradient(180deg, transparent 0 27px, rgba(140,105,55,.12) 27px 28px);
  }
  .log-entry {
    padding: 5px 0;
    animation: fadein .3s ease;
    color: var(--ink);
  }
  .log-entry .log-year {
    color: var(--terra-dark);
    font-weight: 700;
    margin-right: 10px;
    font-variant: small-caps;
  }
  .log-entry.log-event   .log-text   { color: var(--olive); font-weight: 600; }
  .log-entry.log-system  .log-text   { color: var(--ink-soft); font-style: italic; }
  .log-entry.log-warning .log-text   { color: var(--bad); font-weight: 700; }

  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  /* Scrollbars styled like worn leather */
  ::-webkit-scrollbar { width: 11px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,.08); }
  ::-webkit-scrollbar-thumb { background: var(--border-d); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--terra-dark); }
</style>
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header id="top-bar">
    <div id="title-block">
      <h1>Demos</h1>
      <span id="city-name">—</span>
    </div>
    <div id="status-readout">
      <div class="stat-chip">
        <span class="label">Year</span>
        <span class="value" id="hud-year">—</span>
      </div>
      <div class="stat-chip">
        <span class="label">Turn</span>
        <span class="value" id="hud-turn">—</span>
      </div>
      <div class="stat-chip">
        <span class="label">Phase</span>
        <span class="value phase" id="hud-phase">—</span>
      </div>
    </div>
  </header>

  <!-- ============ MAIN VIEWPORT ============ -->
  <main id="viewport">
    <!-- Resources / stores -->
    <section class="panel" id="stats-panel">
      <div class="panel-header">Stores &amp; Wealth</div>
      <div class="panel-body" id="stats-body">
        <!-- populated by render() -->
      </div>
    </section>

    <div id="right-col">
      <!-- Labour assignments -->
      <section class="panel" id="labor-panel">
        <div class="panel-header">Labour of the Demos</div>
        <div id="labor-body">
          <!-- populated by render() -->
        </div>
      </section>

      <!-- Map placeholder -->
      <section class="panel" id="map-panel">
        <div class="panel-header">Landscape &amp; Settlement</div>
        <div class="panel-body">
          <div id="map-placeholder">
            <span class="glyph">⛰️</span>
            <p>The land lies quiet around your fledgling settlement.</p>
            <span class="hint">The city map will take shape here as Demos grows.</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- ============ CONTROL PANEL ============ -->
  <div id="control-panel">
    <span id="control-hint">Advance the chronicle one year at a time.</span>
    <button id="end-turn-btn">End Turn</button>
  </div>

  <!-- ============ CHRONICLE LOG ============ -->
  <section id="chronicle">
    <div class="panel-header">
      <span>The Chronicle</span>
      <span id="era-range" style="color:var(--ink-soft);font-weight:400;letter-spacing:1px;">900 BC – 750 BC</span>
    </div>
    <div id="chronicle-log"></div>
  </section>

<script>
"use strict";

/* ===================================================================
   DEMOS — CORE ENGINE
   A central Game State Object driven by a strict Finite State Machine.
   Phase 1 adds the early-game survival resource economy.
   =================================================================== */

/* ---------- Configuration / Constants ---------- */
const CONFIG = Object.freeze({
  START_YEAR:        900,   // 900 BC
  END_YEAR:          750,   // 750 BC — end of the Dawn Era
  YEARS_PER_TURN:    1,
  PHASE_NAME:        "The Dawn Era",
  // Base grain each citizen eats per turn. Tuned to break even against
  // farmer output (0.40 of pop × yield 2 = 0.8/citizen), so farming alone
  // sustains the settlement while stored grain is the buffer that bad
  // harvests draw down — making famine a real, if avoidable, risk.
  GRAIN_PER_CITIZEN: 0.8,
});

/* The FSM states the game can occupy. */
const GameStatus = Object.freeze({
  BOOT:    "BOOT",     // before initialization
  PLAYING: "PLAYING",  // accepting turns
  ENDED:   "ENDED",    // era complete (or settlement collapsed)
});

/*
 * Fixed early-game job assignments. Each turn the population is divided
 * among these trades by these ratios, and each worker passively yields
 * resources. Ratios are intentionally fixed for the Dawn Era; future
 * phases will let the player reassign labour.
 */
const JOBS = Object.freeze({
  farmers:      { ratio: 0.40, icon: "🌾", name: "Farmers",     yields: "grain"  },
  herders:      { ratio: 0.12, icon: "🐄", name: "Herders",     yields: "cattle" },
  woodcutters:  { ratio: 0.16, icon: "🪓", name: "Woodcutters", yields: "timber" },
  potters:      { ratio: 0.14, icon: "🏺", name: "Potters",     yields: "clay"   },
  oliveGrowers: { ratio: 0.10, icon: "🫒", name: "Olive Tenders", yields: "olives" },
  vintners:     { ratio: 0.08, icon: "🍇", name: "Vintners",    yields: "grapes" },
});

/* Yield per worker, per turn, for the resource that job produces. */
const YIELD = Object.freeze({
  grain:  2,
  cattle: 0.15,   // cattle accrue slowly (rounded down)
  timber: 1,
  clay:   1,
  olives: 1,
  grapes: 1,
});

/* ---------- The central Game State Object ---------- */
const GameState = {
  status:   GameStatus.BOOT,
  cityName: "Demos",
  year:     CONFIG.START_YEAR,   // counts DOWN (BC)
  turn:     0,
  phase:    CONFIG.PHASE_NAME,

  // Early-game survival resources.
  stats: {
    population: 120,   // total headcount
    grain:      90,    // primary food source
    cattle:     8,     // animal wealth — early-game currency
    olives:     12,    // long-term investment / hygiene asset
    grapes:     6,     // social catalyst / ritual drink
    timber:     20,    // structural material
    clay:       15,    // structural material
  },

  // Current turn's job head-counts (derived; for display).
  jobs: {},

  // Net deltas captured during the last tick, used for "+5"/"-2" text.
  lastDeltas: {},

  // The chronicle: an append-only list of historical entries.
  chronicle: [],
};

/* ---------- Display metadata for resources ---------- */
const STAT_META = {
  population: { icon: "👥", label: "Population", sub: "souls" },
  grain:      { icon: "🌾", label: "Grain",      sub: "food stores" },
  cattle:     { icon: "🐄", label: "Cattle",     sub: "wealth & trade" },
  olives:     { icon: "🫒", label: "Olives",     sub: "oil & hygiene" },
  grapes:     { icon: "🍇", label: "Grapes",     sub: "wine & ritual" },
  timber:     { icon: "🪵", label: "Timber",     sub: "building" },
  clay:       { icon: "🧱", label: "Clay",       sub: "building" },
};

/* ---------- Flavor: era-appropriate random events ---------- */
const DAWN_EVENTS = [
  { text: "A bountiful harvest swells the granaries.",          stats: { grain: +24 } },
  { text: "The olive groves come into full bearing.",          stats: { olives: +10 } },
  { text: "The vines yield a heavy, sweet vintage.",           stats: { grapes: +9 } },
  { text: "A stand of oak is felled along the ridge.",         stats: { timber: +14 } },
  { text: "Diggers strike a rich seam of river clay.",         stats: { clay: +12 } },
  { text: "A fine calving season fattens the herds.",          stats: { cattle: +4 } },
  { text: "Wandering shepherds settle among your people.",     stats: { population: +6, cattle: +2 } },
  { text: "Drought withers the standing grain.",               stats: { grain: -18 } },
  { text: "Murrain takes hold; several cattle perish.",        stats: { cattle: -3 } },
  { text: "Raiders drive off beasts under cover of night.",    stats: { cattle: -2, grain: -6 } },
  { text: "A storm scatters the woodpiles and breaks kilns.",  stats: { timber: -8, clay: -5 } },
  { text: "A festival of wine strengthens the people's bonds.",stats: { grapes: -4, population: +3 } },
];

/* ===================================================================
   ENGINE LOGIC
   =================================================================== */

/** Convert internal year value to a display string (e.g. "900 BC"). */
function formatYear(y) {
  return y > 0 ? `${y} BC` : `${Math.abs(y) + 1} AD`;
}

/** Pick a random element from an array. */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/**
 * Append an entry to the chronicle and (if mounted) the log panel.
 * @param {string} text  The message body.
 * @param {string} kind  "system" | "turn" | "event" | "warning"
 */
function logChronicle(text, kind = "turn") {
  const entry = { year: GameState.year, text, kind };
  GameState.chronicle.push(entry);
  renderLogEntry(entry);
}

/**
 * Apply a set of stat changes, clamping at zero, and record net deltas.
 * @param {Object} changes  e.g. { grain: +10, population: -2 }
 */
function applyStats(changes) {
  for (const key in changes) {
    if (!(key in GameState.stats)) continue;
    const before = GameState.stats[key];
    const after = Math.max(0, before + changes[key]);
    GameState.stats[key] = after;
    GameState.lastDeltas[key] = (GameState.lastDeltas[key] || 0) + (after - before);
  }
}

/** Divide the population among the fixed job assignments. */
function assignJobs(population) {
  const counts = {};
  for (const key in JOBS) {
    counts[key] = Math.round(population * JOBS[key].ratio);
  }
  return counts;
}

/**
 * Process the deterministic part of a timeline tick:
 * passive production from labour, then grain consumption / starvation,
 * and surplus-driven population growth.
 */
function processTick() {
  const s = GameState.stats;

  // --- Labour: assign jobs and produce resources passively ---
  const jobs = assignJobs(s.population);
  GameState.jobs = jobs;

  applyStats({
    grain:  jobs.farmers      * YIELD.grain,
    timber: jobs.woodcutters  * YIELD.timber,
    clay:   jobs.potters      * YIELD.clay,
    olives: jobs.oliveGrowers * YIELD.olives,
    grapes: jobs.vintners     * YIELD.grapes,
    cattle: Math.floor(jobs.herders * YIELD.cattle),
  });

  // --- Consumption: every citizen eats grain ---
  const needed = Math.ceil(s.population * CONFIG.GRAIN_PER_CITIZEN);

  if (s.grain >= needed) {
    // The settlement is fed; surplus supports modest growth.
    applyStats({ grain: -needed });
    const surplus = s.grain;   // grain remaining after the meal

    let growth = Math.floor(surplus / 40);
    if (s.olives > 0) growth += 1;                              // health & hygiene
    if (s.grapes > 0 && GameState.turn % 2 === 0) growth += 1;  // festivals & births
    growth = Math.min(growth, Math.ceil(s.population * 0.08));  // cap natural growth

    if (growth > 0) {
      applyStats({ population: +growth });
      logChronicle(`The people prosper; ${growth} new souls join the Demos.`, "turn");
    }
  } else {
    // Granaries run dry — STARVATION.
    const deficit = needed - s.grain;
    applyStats({ grain: -s.grain });   // empty the granary
    const starved = Math.min(s.population, Math.max(1, Math.ceil(deficit)));
    applyStats({ population: -starved });
    logChronicle(
      `⚠ The granaries lie empty — famine claims ${starved} ${starved === 1 ? "soul" : "souls"}.`,
      "warning"
    );
  }
}

/**
 * THE CORE TURN FUNCTION.
 * Advances state, processes the timeline tick, rolls a possible event,
 * and writes feedback to the Chronicle. Guards against running outside
 * the PLAYING state (FSM discipline).
 */
function nextTurn() {
  if (GameState.status !== GameStatus.PLAYING) return;

  // --- 1. Advance the clock ---
  GameState.turn += 1;
  GameState.year -= CONFIG.YEARS_PER_TURN;   // years count down (BC)
  GameState.lastDeltas = {};                  // reset net-change tracking

  logChronicle(`Turn ${GameState.turn} begins. The year is ${formatYear(GameState.year)}.`, "turn");

  // --- 2. Deterministic production / consumption tick ---
  processTick();

  // --- 3. Stochastic historical event (~50% chance) ---
  if (Math.random() < 0.50) {
    const ev = pick(DAWN_EVENTS);
    applyStats(ev.stats);
    logChronicle(ev.text, "event");
  }

  // --- 4. FSM transitions: collapse or era completion ---
  if (GameState.stats.population <= 0) {
    collapse();
  } else if (GameState.year <= CONFIG.END_YEAR) {
    endEra();
  }

  // --- 5. Repaint UI ---
  render();
}

/** FSM transition: PLAYING -> ENDED (successful close of the era). */
function endEra() {
  GameState.status = GameStatus.ENDED;
  logChronicle(
    `The Dawn Era draws to a close. After ${GameState.turn} years, ` +
    `${GameState.cityName} stands ready for the age to come.`,
    "system"
  );
}

/** FSM transition: PLAYING -> ENDED (the settlement has died out). */
function collapse() {
  GameState.status = GameStatus.ENDED;
  logChronicle(
    `The last hearths of ${GameState.cityName} grow cold. The settlement is abandoned.`,
    "warning"
  );
}

/* ===================================================================
   RENDERING
   =================================================================== */

/** Repaint the entire HUD, resource panel, and labour panel from GameState. */
function render() {
  // Top bar
  document.getElementById("city-name").textContent = `of ${GameState.cityName}`;
  document.getElementById("hud-year").textContent  = formatYear(GameState.year);
  document.getElementById("hud-turn").textContent  = GameState.turn;
  document.getElementById("hud-phase").textContent = GameState.phase;

  // Resource panel
  const body = document.getElementById("stats-body");
  body.innerHTML = "";
  for (const key in GameState.stats) {
    const meta = STAT_META[key] || { icon: "•", label: key, sub: "" };
    const delta = GameState.lastDeltas[key] || 0;

    let deltaClass = "zero", deltaText = "—";
    if (delta > 0) { deltaClass = "pos"; deltaText = `+${delta}`; }
    else if (delta < 0) { deltaClass = "neg"; deltaText = `${delta}`; }

    const row = document.createElement("div");
    row.className = "stat-row";
    row.innerHTML =
      `<span class="stat-name">` +
        `<span class="stat-icon">${meta.icon}</span>` +
        `<span><div>${meta.label}</div><div class="stat-sub">${meta.sub}</div></span>` +
      `</span>` +
      `<span class="stat-figures">` +
        `<span class="stat-val">${GameState.stats[key]}</span>` +
        `<span class="delta ${deltaClass}">${deltaText}</span>` +
      `</span>`;
    body.appendChild(row);
  }

  // Labour panel
  const labor = document.getElementById("labor-body");
  labor.innerHTML = "";
  for (const key in JOBS) {
    const job = JOBS[key];
    const count = (GameState.jobs && GameState.jobs[key]) || 0;
    const card = document.createElement("div");
    card.className = "job-card";
    card.innerHTML =
      `<div class="job-icon">${job.icon}</div>` +
      `<div class="job-count">${count}</div>` +
      `<div class="job-name">${job.name}</div>`;
    labor.appendChild(card);
  }

  // Control panel reflects the FSM.
  const btn = document.getElementById("end-turn-btn");
  if (GameState.status === GameStatus.ENDED) {
    btn.disabled = true;
    btn.textContent = "Era Complete";
    document.getElementById("control-hint").textContent =
      GameState.stats.population <= 0
        ? "The Demos is no more. Refresh to begin anew."
        : "The Dawn Era has ended. A new age awaits in a future phase.";
  }
}

/** Append a single chronicle entry to the log panel and scroll into view. */
function renderLogEntry(entry) {
  const log = document.getElementById("chronicle-log");
  const cls = entry.kind === "event"   ? " log-event"
            : entry.kind === "system"  ? " log-system"
            : entry.kind === "warning" ? " log-warning" : "";
  const el = document.createElement("div");
  el.className = "log-entry" + cls;
  el.innerHTML =
    `<span class="log-year">${formatYear(entry.year)}</span>` +
    `<span class="log-text">${entry.text}</span>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

/* ===================================================================
   BOOTSTRAP
   =================================================================== */

function initGame() {
  GameState.status = GameStatus.PLAYING;   // FSM: BOOT -> PLAYING
  GameState.jobs = assignJobs(GameState.stats.population);
  render();
  logChronicle(
    `In the year ${formatYear(CONFIG.START_YEAR)}, a scattering of families ` +
    `founds the settlement of ${GameState.cityName} upon the dry hills.`,
    "system"
  );
  logChronicle("Farmers sow grain, herders tend cattle, and the kilns are lit.", "system");
  logChronicle("The Dawn Era begins. Press “End Turn” to let the years unfold.", "system");

  document.getElementById("end-turn-btn").addEventListener("click", nextTurn);
}

window.addEventListener("DOMContentLoaded", initGame);
</script>
</body>
</html>
